  g.fillStyle="#54455a"; g.font="800 44px "+F;
  g.fillText(tr("🧊 立方体チャレンジ","🧊 Cube Challenge"), M, 78);
  g.fillStyle="#8a6f80"; g.font="700 25px "+F;
  g.fillText(MODES[mode].name+tr("　そうごうスコア","  ·  Total Score"), M, 118);
  g.textAlign="right";
  g.fillStyle="#54455a"; g.font="800 74px "+F;
  g.fillText(lastFinal.avg.toFixed(2)+tr("点"," pts"), Wc-M, 88);
  g.fillStyle=gradeColor(lastFinal.g); g.font="800 36px "+F;
  g.fillText(tr("グレード ","Grade ")+lastFinal.g, Wc-M, 132);
  // 5x2 thumbnails
  const imgs=await Promise.all(roundsInfo.map(r=>loadImg(r.shot)));
  const gw=(Wc-2*M-4*14)/5, gh=138;
  roundsInfo.forEach((info,i)=>{
    const x=M+(i%5)*(gw+14), y=162+Math.floor(i/5)*(gh+44);

    g.fillText(info.practice?`R${i+1} 🌱`:`R${i+1}  ${info.score.toFixed(2)}`, x+gw/2, y+gh+28);
  });
  g.textAlign="center"; g.fillStyle="#54455a"; g.font="800 34px "+F;
  const sp=(lastFinal.specials||[]);
  g.fillText(tr(`称号：${lastFinal.ttl.emoji} ${lastFinal.ttl.name}`,`Title: ${lastFinal.ttl.emoji} ${lastFinal.ttl.name}`)+(lastFinal.isBest?"　🏆":""),
    Wc/2, sp.length?Hc-100:Hc-80);
  if(sp.length){
    const shown=sp.slice(0,3);
    let txt=shown.map(s=>`${s.emoji} ${s.name}`).join("　＋　")
      + (sp.length>3 ? tr(`　ほか${sp.length-3}`,`  +${sp.length-3}`) : "");
    g.fillStyle="#7a6ab8";
    let fs=22;                                  // 幅に収まるまで縮める
    for(; fs>12; fs--){ g.font="800 "+fs+"px "+F; if(g.measureText(txt).width<=Wc-2*M) break; }
    g.fillText(txt, Wc/2, Hc-62);
  }
  g.textAlign="left"; g.fillStyle="#e86f9e"; g.font="800 26px "+F;
  g.fillText(tr("#立方体チャレンジ","#CubeChallenge"), M, Hc-26);
  g.textAlign="right"; g.fillStyle="#8a6f80"; g.font="700 22px "+F;
  if(isDaily){
    const dm=(dailyDate||"").match(/(\d+)-(\d+)-(\d+)$/);   // 開始時の日付を刻む
    const lbl=dm?`${+dm[2]}/${+dm[3]}`:"";
    g.fillText(tr(`📅 デイリー ${lbl}`,`📅 Daily ${lbl}`), Wc-M, Hc-26);
  }
  return c.toDataURL("image/png");
}

const DAILY_KEY="cube-challenge-daily-v1";
/* きょうのチャレンジは1日3回まで（挑戦を始めた時点で1回消費する）。
   端末内の記録なので厳密な制限ではないが、粘り勝ちを防ぐ目安として機能する。 */
const DAILY_MAX=3;
function dailyRec(date){
  const d=date||todaySeedStr();
  let r=null; try{ r=JSON.parse(localStorage.getItem(DAILY_KEY)); }catch(_){}
  if(!r || r.date!==d) r={date:d, score:null, tries:0};
  if(typeof r.tries!=="number" || !(r.tries>=0)) r.tries=0;
  if(typeof r.score!=="number") r.score=null;
  return r;
}
function saveDailyRec(r){ try{ localStorage.setItem(DAILY_KEY, JSON.stringify(r)); }catch(_){} }
function dailyLeft(){ return Math.max(0, DAILY_MAX-dailyRec().tries); }
function startDaily(){
  const r=dailyRec();
  if(r.tries>=DAILY_MAX){
    toast(tr(`きょうの挑戦は${DAILY_MAX}回までです。また明日ね！`,`${DAILY_MAX} tries per day — see you tomorrow!`));
    refreshDaily();
    return;
  }
  r.tries++; saveDailyRec(r);
  startGame("normal",{seed:todaySeedStr(),daily:true});
}
function refreshDaily(){
  const rec=dailyRec(), left=Math.max(0, DAILY_MAX-rec.tries);
  const best = rec.score!==null ? tr(`きょう ${(+rec.score).toFixed(2)}点 / `,`Today ${(+rec.score).toFixed(2)} · `) : "";
  $("#bestDailyLab").textContent = best + (left>0
    ? tr(`のこり${left}回`,`${left} left`)
    : tr("きょうは終了","done for today"));
  const b=$("#btnDaily");
  b.disabled = left===0;
  b.style.opacity = left===0 ? .55 : 1;
}

/* リサイズ・画面回転時はお題を作り直さず、一様スケール＋平行移動で安全域に収め直す。
   （作り直すと不利／チートになるため。相似変換なので採点条件は変わらない） */
window.addEventListener("resize",()=>{
  resizeCanvases();
  if(round && (!Number.isFinite(round.cubes[0].P[0].x) || round.targets.length===0)){
    // 非表示タブ(0x0)などで壊れた状態で生成されたラウンドは作り直す
    if(W>50 && H>50) newRound();
    return;
  }
  if(round){
    const landscape = W>=H;
    const mL=24, mR=landscape?195:24, mT=70, mB=landscape?40:175;
    const availW=Math.max(60,W-mL-mR), availH=Math.max(60,H-mT-mB);
    const pts=[]; round.cubes.forEach(c=>pts.push(...c.P));
    const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    const l=Math.min(...xs), r=Math.max(...xs), t=Math.min(...ys), b=Math.max(...ys);
    const bw=Math.max(r-l,1e-6), bh=Math.max(b-t,1e-6);
    // 収まらないときだけ縮小（勝手に拡大はしない）
    const s=Math.min(1, availW/bw*0.98, availH/bh*0.98);
    const cx0=(l+r)/2, cy0=(t+b)/2;
    let ax=(mL+(W-mR))/2 - cx0*s, ay=(mT+(H-mB))/2 - cy0*s;
    // 相似変換後に安全域からはみ出していれば平行移動で戻す
    const nl=l*s+ax, nr=r*s+ax, nt=t*s+ay, nb=b*s+ay;
    if(nl<mL) ax+=mL-nl; else if(nr>W-mR) ax+=W-mR-nr;
    if(nt<mT) ay+=mT-nt; else if(nb>H-mB) ay+=H-mB-nb;
    if(s!==1 || ax!==0 || ay!==0){
      const seen=new Set();
      const xf=p=>{ if(seen.has(p))return; seen.add(p); p.x=p.x*s+ax; p.y=p.y*s+ay; };
      round.cubes.forEach(c=>{ c.P.forEach(xf); c.tol*=s; });   // targetsのpa,pbはc.Pと同じ参照
      round.targets.forEach(t2=>{ t2.samples.forEach(xf); t2.tol*=s; });
      // allSegsのpa,pbはEXT延長した独立コピーなので、座標も必ず変換する
      // （忘れると採点が移動前の位置と照合され、正確な絵が大減点になる）
      round.allSegs.forEach(g=>{ xf(g.pa); xf(g.pb); g.tol*=s; });
      strokes.forEach(st=>st.pts.forEach(xf));
      if(cur) cur.pts.forEach(xf);
      history.forEach(snap=>snap.forEach(st=>st.pts.forEach(xf)));
      hoverPos=null;
    }
  }
  rebuildInk(); render();
});

   && (location.protocol==="https:" || location.hostname==="localhost")
   && !location.hostname.includes("itch.zone")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

resizeCanvases();
refreshMenuBest();
render();
</script>
