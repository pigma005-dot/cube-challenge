  strokes=mergeCollinearScoreStrokes(strokes);
  let sp = resampleStrokes(strokes, 4);
  let step = 4;                  // spの点間隔[論理単位]（外れた線の長さを出すのに使う）
  if(sp.length>3500){
    const k=Math.ceil(sp.length/3500);
    sp = sp.filter((_,i)=>i%k===0);
    step = 4*k;
  }
  if(sp.length===0){
    round.targets.forEach(t=>t.score=0);
    return {score:0, cov:0, structure:0, modelFit:0, prec:0, eff:1,
            inkRatio:0, doodle:null, mirrored:false};
  }
  /* 回廊インクは「サンプル数×step」ではなく、各点が受け持つ実際の線分長で
     積分する。固定stepだと長さ8.000±εで点が3→4個に増え、同じ見た目の線が
     12→16単位（+33%）へ跳ねて候補線課金に大きな崖を作っていた。
     端点は隣接線分の半分、内部点は前後線分の半分ずつを受け持つため、
     ストローク内の合計は常にそのポリラインの実長になる。 */
  const sampleInk=sp.map((p,i)=>{
    let w=0;
    if(i>0 && sp[i-1].si===p.si) w+=0.5*Math.hypot(p.x-sp[i-1].x,p.y-sp[i-1].y);
    if(i+1<sp.length && sp[i+1].si===p.si) w+=0.5*Math.hypot(sp[i+1].x-p.x,sp[i+1].y-p.y);
    return w;
  });
  /* cov: 「辺と同じ向きの線」だけがその辺を描いたことになる（v1.25）。
     グリッドや点打ちで面を覆うと近さだけでcovが稼げてしまう穴（レビュー報告）への対策。
     なぞり・ハリガネ描き・アタリ線は向きが一致するので従来どおり満点になる。
     25°までは満点扱い（手ぶれ幅）、60°以上ずれた線は0点。
     さらにインクは「点の集まり」ではなく「点をつないだ線分」として測る:
     リサンプル論理4単位刻みの量子化誤差（最大2単位）が消え、完璧になぞれば理論上100.00になる。
     タップ（1点だけのストローク）は線分にならないので引き続き無得点。 */
  const DIR_COS0=0.5, DIR_NORM=1/(0.9063-0.5);   // cos60°〜cos25°をなだらかに
  const segs=[];
  for(let j=1;j<sp.length;j++){
    const a=sp[j-1], b=sp[j];
    if(a.si!==b.si) continue;              // 別ストロークはつながない
    let dx=a.dx+b.dx, dy=a.dy+b.dy, L=Math.hypot(dx,dy);
    if(L<1e-6){ dx=b.x-a.x; dy=b.y-a.y; L=Math.hypot(dx,dy); }   // Uターンの縮退は弦の向きで
    if(L<1e-6) continue;
    segs.push({ax:a.x,ay:a.y,bx:b.x,by:b.y,si:a.si,
               mx:(a.x+b.x)/2,my:(a.y+b.y)/2, dx:dx/L, dy:dy/L});
  }
  /* 各ストロークの始点・終点。「どこで線を止めたか」は端点を伝える唯一の情報なので、
     はみ出し減点の免罪符に使う（本線を角で止めていれば、アタリ線を足しても満点のまま）。 */
  /* ストロークごとの長さ[論理単位]。免罪符の資格判定に使う（下の termAt 参照）。 */
  const strokeLen=new Map();
  for(let j=1;j<sp.length;j++){
    if(sp[j].si!==sp[j-1].si) continue;
    strokeLen.set(sp[j].si, (strokeLen.get(sp[j].si)||0)+
      Math.hypot(sp[j].x-sp[j-1].x,sp[j].y-sp[j-1].y));
  }
  const termini=[];
  for(let j=0;j<sp.length;j++){
    const prev=j>0?sp[j-1]:null, next=j<sp.length-1?sp[j+1]:null;
    if(!prev || prev.si!==sp[j].si || !next || next.si!==sp[j].si)
      termini.push({x:sp[j].x, y:sp[j].y, dx:sp[j].dx, dy:sp[j].dy,
                    si:sp[j].si, len:strokeLen.get(sp[j].si)||0});
  }
  /* 正解辺そのものを端から端までなぞったストローク。
     透視投影で別の平行辺の回廊に重なる構図があり、そのときには
     「通過線」に見える。正解の2〜3回なぞりを重複作図線と誤判定しないよう
     元の端点対にコミットしている線を先に識別する。 */
  const strokeEnds=new Map();
  for(let pi=0;pi<sp.length;pi++){
    const p=sp[pi];
    if(!strokeEnds.has(p.si)) strokeEnds.set(p.si,{first:p,last:p});
    else strokeEnds.get(p.si).last=p;
  }
  const committedStroke=new Set(), strictCommittedStroke=new Set();
  /* 部分ストロークは最も近い正解辺1本だけへ割り当てる。
     遠近で別方向の辺がほぼ重なる構図では、複数辺の回廊へ同時に入ることがある。
     その全部を所有先にすると、正しい分割描画が隣の辺の候補線として二重計上される。 */
  const strokeOwners=new Map();       // si → {ti,cost}: 最も自然な所有先
  for(const [si,e] of strokeEnds){
    for(let ti=0;ti<round.targets.length;ti++){
      const t=round.targets[ti];
      if(t.pts) continue;
      const edgeLen=t.len||Math.hypot(t.pb.x-t.pa.x,t.pb.y-t.pa.y);
      const drawnLen=strokeLen.get(si)||0;
      const ex=t.pb.x-t.pa.x, ey=t.pb.y-t.pa.y, eL2=ex*ex+ey*ey;
      if(eL2>1e-9 && drawnLen>=0.07*edgeLen){
        const ownPt=p=>{
          const rx=p.x-t.pa.x, ry=p.y-t.pa.y;
          const proj=(rx*ex+ry*ey)/eL2;
          const lateral=Math.abs(rx*ey-ry*ex)/Math.sqrt(eL2);
          return lateral<=t.tol && proj>=-0.08 && proj<=1.08
            ? {proj,lateral} : null;
        };
        const first=ownPt(e.first), last=ownPt(e.last);
        if(first&&last){
          const overflow=p=>Math.max(0,-p, p-1);
          const cost=(first.lateral+last.lateral)/Math.max(1,t.tol)
                    +4*(overflow(first.proj)+overflow(last.proj));
          const prev=strokeOwners.get(si);
          if(!prev || cost<prev.cost) strokeOwners.set(si,{ti,cost});
        }
      }
      /* 端点の手ぶれは認めるが、90/110%の長さ候補まで「正解辺」に
         昇格させない。端点と長さの両方が合うことを要求する。 */
      if(!(edgeLen>0) || drawnLen<0.92*edgeLen || drawnLen>1.08*edgeLen) continue;
      const tol=0.75*t.tol;
      const direct=Math.hypot(e.first.x-t.pa.x,e.first.y-t.pa.y)<=tol &&
                   Math.hypot(e.last.x-t.pb.x,e.last.y-t.pb.y)<=tol;
      const reverse=Math.hypot(e.first.x-t.pb.x,e.first.y-t.pb.y)<=tol &&
                    Math.hypot(e.last.x-t.pa.x,e.last.y-t.pa.y)<=tol;
      if(direct||reverse){
        committedStroke.add(si);
        /* candidateEvidence では、端点だけでなく長さもほぼ答えた線を
           「別候補」から除外する。通常の committed (92〜108%) を丸ごと
           除外すると95%長の候補攻撃まで無料になるため、96〜104%に限定し、
           他辺の回廊へ誤って免除を貸さないよう対象辺ごとのキーで保持する。 */
        if(drawnLen>=0.96*edgeLen && drawnLen<=1.04*edgeLen)
          strictCommittedStroke.add(ti+":"+si);
        break;
      }
    }
  }
  /* はみ出し減点。辺を通り過ぎて描くと「辺がどこで終わるか」を答えていないので、
     はみ出した長さ（辺長比）に応じて端点評価を下げる。
     ・角で折り返す一筆書きははみ出さないので影響なし
     ・本線＋アタリ線は、本線の終点が角にあるので termini 側で満点になる
     8%までは手のブレとして無料。 */
  const OVER_FREE=0.08, OVER_K=1.2;
  const overDamp=e=>Math.exp(-OVER_K*Math.max(0,e-OVER_FREE));
  const smooth=(a,b,x)=>{ const u=clamp((x-a)/(b-a),0,1); return u*u*(3-2*u); };
  /* ▼アタリ線らしさ(guideScore)は、はみ出し測定より前に必要になったのでここで計算する。
     （認定済みアタリ線のインクを「本線のはみ出し」に数えないため。
     旧配置では、辺の延長方向へ引いた正しいアタリ線が本線のはみ出し扱いになり、
     本線を分割して描く癖の人が termAt の資格を失って -2.5〜-5.5点を受けていた） */
  const boxes=inkBoxes(round);
  const inBox=p=>boxes.some(b=>p.x>=b.l&&p.x<=b.r&&p.y>=b.t&&p.y<=b.b);
  const GUIDE_W=0.35, GUIDE_WASTE_W=0.20;
  const guideScore=new Map();
  let guideBudget=0;
  {
    /* 補助線らしさを0〜1の連続値で評価する。生のpointer event点数は使わず、
       論理4単位へリサンプル済みのspだけを見るため、端末の報告頻度や
       no-op消しゴムによる点の増減で判定が反転しない。 */
    const maxTL=round.targets.reduce((a,t)=>
      Math.max(a, t.len||Math.hypot(t.pb.x-t.pa.x,t.pb.y-t.pa.y)), 0);
    /* ★アタリ線の物差しは「そのラウンドの最長ターゲット」ではなく立方体のスケールで測る。
       2面ビューの回はターゲットが短い奥行き辺だけになり、maxTL基準だと
       同じ長さの正しい作図線が「長すぎ」判定で予算超過し、5辺の回では無料の
       8本作図が3辺の回では-40点になっていた（実測59.4点）。ヒント面の辺は
       全ラウンド共通で約HINT_FACE_SIZEに正規化されているのでこれを下限にする。 */
    const guideRuler=Math.max(maxTL, HINT_FACE_SIZE);
    const groups=new Map();
    for(const p of sp){ if(!groups.has(p.si)) groups.set(p.si,[]); groups.get(p.si).push(p); }
    for(const [si,p] of groups){
      if(p.length<2 || !(guideRuler>0)){ guideScore.set(si,0); continue; }
      let L=0;
      for(let i=1;i<p.length;i++){
        const dl=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
        L+=dl;
      }
      const a=p[0], b=p[p.length-1], dx=b.x-a.x, dy=b.y-a.y;
      const chord=Math.hypot(dx,dy);
      if(L<1e-6 || chord<1e-6){ guideScore.set(si,0); continue; }
      const ux=dx/chord, uy=dy/chord;
      let axisDot=0, vertexNear=Infinity, nearTol=20;
      for(const c of round.cubes){
        for(const e of c.edges){
          const q0=c.P[e.a], q1=c.P[e.b], ex=q1.x-q0.x, ey=q1.y-q0.y;
          const el=Math.hypot(ex,ey);
          if(el>1e-6) axisDot=Math.max(axisDot,Math.abs((ux*ex+uy*ey)/el));
        }
        for(const v of c.P.slice(0,8)){
          const d=Math.abs(dx*(v.y-a.y)-dy*(v.x-a.x))/chord;
          if(d<vertexNear){ vertexNear=d; nearTol=c.tol; }
        }
      }
      /* 1.8倍で十分な補助線として飽和させる（旧2.2倍。中途半端な飽和位置だと
         短めの正しい作図線が fit≈0.66 になり、34%の残額×本数が小さな baseLen を
         押し流して3辺ラウンドだけアタリ線が重罰になっていた）。 */
      /* 頂点を通り、立方体軸に沿い、十分まっすぐで外へ伸びている線は、
         1.1〜1.8倍の実用長でも補助線である。旧窓(1.10〜1.80)は認定が
         追いつく前に線量だけ増やし、8本の補助線が長くなるほど100→67→100点と
         非単調に落ちた。長さは補助条件の一つに留め、0.8〜1.1倍で滑らかに確定する。 */
      const lengthFit=smooth(0.80,1.10,L/guideRuler);
      /* 外接矩形からの「はみ出し率」は補助線の必須条件にしない。
         正しい軸方向の補助線でも、投影構図によっては長い線全体が別の頂点を含む
         外接矩形内へ収まる。その場合だけ機械的に正確な同じ線より重く減点すると、
         手描きの2度程度の角度差・0.5tol程度の頂点ずれが無駄線へ反転していた。
         十分な長さ・直線性・立方体軸・頂点近傍という作図の本質的な条件を用いる。 */
      const straightFit=smooth(0.88,0.985,chord/L);
      const axisFit=smooth(0.90,0.985,axisDot);
      const vertexFit=1-smooth(1.0,2.2,vertexNear/Math.max(1,nearTol));
      guideScore.set(si,lengthFit*straightFit*axisFit*vertexFit);
    }
    /* 補助線軽減の全体予算（20×物差し ≒ 8本×2.5辺長）。
       ★予算は「インク量の免除の上限」としてだけ効かせる（下の overdraw 参照）。
       旧実装のように guideScore 自体を縮めると、超過した瞬間に
       (1-0.9g) の残額課金と箱外waste課金が同時に跳ね上がる二重罰になり、
       正しい作図線の5→6本目で100点→58点の壁ができていた。 */
    guideBudget=20*guideRuler;
  }
  /* 一筆書き保護は「ストロークが長い」だけでは認めず、同じストロークが
     実際に別の正解辺も描いていることを確認する。各サンプルは最も近い
     一つの正解辺だけへ割り当て、交点付近の二重計上を避ける。 */
  const strokeTargetInk=new Map();
  for(let pi=0;pi<sp.length;pi++){
    const p=sp[pi];
    let bestTi=-1, bestNorm=Infinity;
    for(let tj=0;tj<round.targets.length;tj++){
      const t2=round.targets[tj];
      if(t2.pts) continue;
      const dx=t2.pb.x-t2.pa.x, dy=t2.pb.y-t2.pa.y, l2=dx*dx+dy*dy;
      if(l2<=1e-9) continue;
      const len=Math.sqrt(l2), rx=p.x-t2.pa.x, ry=p.y-t2.pa.y;
      const proj=(rx*dx+ry*dy)/l2;
      if(proj<-0.1 || proj>1.1) continue;
      if(Math.abs(p.dx*dx+p.dy*dy)/len<=DIR_COS0) continue;
      const norm=Math.abs(rx*dy-ry*dx)/(len*Math.max(1e-6,t2.tol));
          /* 回廊境界ちょうどの点を一方の所有判定だけへ入れると、最下位bitで
             候補課金が発火した。境界は両方とも圏外にして同着を安定させる。 */
          if(norm>=1 || norm>=bestNorm) continue;
      bestNorm=norm; bestTi=tj;
    }
    if(bestTi>=0){
      let byTarget=strokeTargetInk.get(p.si);
      if(!byTarget){ byTarget=new Float64Array(round.targets.length); strokeTargetInk.set(p.si,byTarget); }
      byTarget[bestTi]+=sampleInk[pi];
    }
  }
  let covSum=0;
  for(let ti=0;ti<round.targets.length;ti++){
    const t=round.targets[ti];
    // サンプルごとの「辺の向き」: 線分は一律、ポリライン（円など）は各点の接線
    const dirs=[];
    if(t.pts){
      const n=t.samples.length;
      for(let k=0;k<n;k++){
        const a=t.pts[(k-1+n)%n], b=t.pts[(k+1)%n];
        const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
        dirs.push({x:dx/L, y:dy/L});
      }
    }else{
      const dx=t.pb.x-t.pa.x, dy=t.pb.y-t.pa.y, L=Math.hypot(dx,dy)||1;
      const d0={x:dx/L, y:dy/L};
      for(let k=0;k<t.samples.length;k++) dirs.push(d0);
    }
    t._dirs=dirs;               // 鏡像判定でも同じ向きデータを使う
    /* 距離falloffだけでは、tolより細かい周期の極短点線が隙間を埋めて
       ほぼ満点になる。直線辺では、回廊内に実在する同方向線分を辺軸へ
       投影し、区間unionの実線率と各採点点を支える連続区間長を測る。
       全体率だけでは「中央の長い線＋残りを極短点線」で水増しできるため、
       最寄り区間が1単位以下なら支えなし、6単位以上なら通常線として扱う。
       8:4・6:4点線、普通の分割、同じ線の重ね描きは維持される。斜線は
       ±tol回廊へparametric clipし、回廊外の長さで率を水増しさせない。 */
    const dutyMerged=[],dutySupport=new Map();
    let dutyEx=0,dutyEy=0,dutyEL=0,dutyEL2=0,dutyGlobalW=1;
    if(!t.pts){
      dutyEx=t.pb.x-t.pa.x; dutyEy=t.pb.y-t.pa.y;
      dutyEL2=dutyEx*dutyEx+dutyEy*dutyEy; dutyEL=Math.sqrt(dutyEL2);
      /* duty は「その場所に実線が存在するか」だけを支える補助ゲートで、
         距離得点そのものは直後の falloff(t.tol) が決める。ここまで±tolで切ると、
         tolを僅かに外れた普通の手描きが falloffで滑らかに減る前に0へ落ちる。
         存在判定だけ2tolへ広げる。境界では距離得点が約0.4%まで減衰済みなので、
         極短点線のduty防御を保ったまま切替えの実害をほぼゼロにできる。 */
      const dutyTol=2.0*t.tol;
      const intervals=[];
      if(dutyEL2>1e-9) for(const g2 of segs){
        const dot=Math.abs(g2.dx*dutyEx+g2.dy*dutyEy)/dutyEL;
        if(dot<=DIR_COS0) continue;
        const p0=((g2.ax-t.pa.x)*dutyEx+(g2.ay-t.pa.y)*dutyEy)/dutyEL2;
        const p1=((g2.bx-t.pa.x)*dutyEx+(g2.by-t.pa.y)*dutyEy)/dutyEL2;
        const l0=((g2.ax-t.pa.x)*dutyEy-(g2.ay-t.pa.y)*dutyEx)/dutyEL;
        const l1=((g2.bx-t.pa.x)*dutyEy-(g2.by-t.pa.y)*dutyEx)/dutyEL;
        let ta=0,tb=1;
        const dl=l1-l0;
        if(Math.abs(dl)<1e-12){ if(Math.abs(l0)>dutyTol) continue; }
        else{
          const x0=(-dutyTol-l0)/dl, x1=(dutyTol-l0)/dl;
          ta=Math.max(0,Math.min(x0,x1)); tb=Math.min(1,Math.max(x0,x1));
          if(tb<=ta) continue;
        }
        const cp0=p0+(p1-p0)*ta, cp1=p0+(p1-p0)*tb;
        const rawLo=Math.min(cp0,cp1),rawHi=Math.max(cp0,cp1);
        const lo=Math.max(0,rawLo),hi=Math.min(1,rawHi);
        if(hi>lo) intervals.push({lo,hi,rawLo,rawHi,g:g2,si:g2.si});
      }
      intervals.sort((a,b)=>a.lo-b.lo||a.hi-b.hi||a.si-b.si);
      for(const iv of intervals){
        const last=dutyMerged[dutyMerged.length-1];
        /* 同じストロークの隣接resample区間は投影丸め誤差だけ離れることがある。 */
        if(!last || iv.lo>last[1]+1e-9) dutyMerged.push([iv.lo,iv.hi]);
        else if(iv.hi>last[1]) last[1]=iv.hi;
      }
      const duty=dutyMerged.reduce((sum,iv)=>sum+iv[1]-iv[0],0);
      dutyGlobalW=smooth(0.20,0.65,duty);
      /* 支え長は候補を採点した線分と同じストローク内だけで連結する。
         横へずれた長い線を一本足し、その実線率・長さを正解位置のmicrodashへ
         貸す攻撃を防ぐ。 */
      const byStroke=new Map();
      for(const iv of intervals){
        let list=byStroke.get(iv.si); if(!list){ list=[]; byStroke.set(iv.si,list); }
        list.push(iv);
      }
      const finishSupport=(rawLo,rawHi,members)=>{
        /* clip後に端へ触れたかで固定長を与えると、極短線を8e-6動かすだけで
           6〜9点変わった。回廊clip前の実投影長を使えば、端の短線・長線・
           overshootがすべて座標に対して連続になる。 */
        const support=Math.max(0,rawHi-rawLo)*dutyEL;
        const w=smooth(1.0,6.0,support);
        for(const iv of members) dutySupport.set(iv.g,w);
      };
      for(const list of byStroke.values()){
        list.sort((a,b)=>a.lo-b.lo||a.hi-b.hi);
        let lo=0,hi=0,rawLo=0,rawHi=0,members=[];
        for(const iv of list){
          if(!members.length || iv.lo<=hi+1e-9){
            if(!members.length){
              lo=iv.lo; hi=iv.hi; rawLo=iv.rawLo; rawHi=iv.rawHi;
            }else{
              if(iv.hi>hi) hi=iv.hi;
              if(iv.rawLo<rawLo) rawLo=iv.rawLo;
              if(iv.rawHi>rawHi) rawHi=iv.rawHi;
            }
            members.push(iv);
          }else{
            finishSupport(rawLo,rawHi,members);
            lo=iv.lo; hi=iv.hi; rawLo=iv.rawLo; rawHi=iv.rawHi; members=[iv];
          }
        }
        if(members.length) finishSupport(rawLo,rawHi,members);
      }
    }
    const dutyAt=g=>t.pts ? 1 : dutyGlobalW*(dutySupport.get(g)||0);
    const cutM=3*t.tol+step, cutM2=cutM*cutM;   // 中点での粗い足切り（線分長ぶんの余裕込み）
    let q=0, end0=0, end1=0;
    for(let si2=0;si2<t.samples.length;si2++){
      const s=t.samples[si2], sd=dirs[si2];
      let best=0;
      for(const g2 of segs){
        const mdx=g2.mx-s.x, mdy=g2.my-s.y;
        if(mdx*mdx+mdy*mdy>=cutM2) continue;
        const dot=Math.abs(g2.dx*sd.x + g2.dy*sd.y);
        if(dot<=DIR_COS0) continue;
        const w=Math.min(1,(dot-DIR_COS0)*DIR_NORM);
        const c=falloff(distToSeg(s.x,s.y,g2.ax,g2.ay,g2.bx,g2.by), t.tol)*w*dutyAt(g2);
        if(c>best){ best=c; if(best>=0.9995) break; }
      }
      q+=best;
      if(!t.pts){
        if(si2===0) end0=best;
        if(si2===t.samples.length-1) end1=best;
      }
    }
    t.score = q/t.samples.length;
    if(t.pts){
      t.endScore = t.score;      // 円は閉曲線なので端点を持たない
    }else{
      /* 辺の直線に沿って、両端をどれだけ通り過ぎているかを測る。
         あわせて、辺の回廊（±10%）にある同方向インクをストローク別に集める。 */
      let tMin=0, tMax=1;
      const corMap=new Map();   // si → {ink, minP, maxP, minPt, maxPt}: 回廊内の同方向インク
      const ex=t.pb.x-t.pa.x, ey=t.pb.y-t.pa.y, eL2=ex*ex+ey*ey;
      const eL=Math.sqrt(eL2);
      if(eL2>1e-9){
        for(let pi=0;pi<sp.length;pi++){
          const p=sp[pi];
          const rx=p.x-t.pa.x, ry=p.y-t.pa.y;
          const proj=(rx*ex+ry*ey)/eL2;
          if(proj<-2 || proj>3) continue;                 // 遠すぎる点は無関係
          const lat=Math.abs(rx*ey-ry*ex)/eL;
          /* 回廊境界ちょうどの線だけがcandidate runへ入り、0.0001tolの差で
             正解へ描き直した点が約20点変わっていた。丸め余裕を持たせ、
             境界は一貫して圏外として扱う。距離coverage側の連続減衰は別に残る。 */
          if(lat >= t.tol*(1-1e-9)) continue;
          /* 交差する別方向の辺や補助線を「この辺のはみ出し」に数えない。
             同じ向きのインクだけが、その辺をどこまで延ばしたかを決める。 */
          if(Math.abs(p.dx*ex+p.dy*ey)/eL<=DIR_COS0) continue;
          /* ★他のターゲット辺の本体を、この辺の回廊・はみ出しに数えない。
             浅い角度（60°未満）で接続する隣の辺は、方向ゲートも横tolも
             すり抜けて [1, 1.3] のような偽のはみ出し・偽の回廊runを作り、
             一筆書きや隣接辺の分割描きを構図依存で45〜58点へ落としていた。
             その点が別のターゲット辺の線分により近いなら、そちらの辺の
             絵の一部とみなしてこの辺では無視する（同距離ならこの辺に残す）。
             論理座標化の最下位ビット差（約1e-13）で共有角の同着が逆転しないよう、
             関連座標の浮動小数精度だけ比較に余裕を持たせる。 */
          let foreign=false;
          for(const t2 of round.targets){
            if(t2===t || t2.pts) continue;
            const foreignTieEps=64*Number.EPSILON*Math.max(1,
              Math.abs(p.x),Math.abs(p.y),
              Math.abs(t.pa.x),Math.abs(t.pa.y),Math.abs(t.pb.x),Math.abs(t.pb.y),
              Math.abs(t2.pa.x),Math.abs(t2.pa.y),Math.abs(t2.pb.x),Math.abs(t2.pb.y));
            if(distToSeg(p.x,p.y,t2.pa.x,t2.pa.y,t2.pb.x,t2.pb.y)+foreignTieEps < lat){
              foreign=true; break;
            }
          }
          if(foreign) continue;
          let c2=corMap.get(p.si);
          if(!c2){
            c2={ink:0,minP:proj,maxP:proj,
                minPt:{x:p.x,y:p.y},maxPt:{x:p.x,y:p.y}};
            corMap.set(p.si,c2);
          }
          if(proj>=-0.1 && proj<=1.1) c2.ink+=sampleInk[pi];
          if(proj<c2.minP){ c2.minP=proj; c2.minPt={x:p.x,y:p.y}; }
          if(proj>c2.maxP){ c2.maxP=proj; c2.maxPt={x:p.x,y:p.y}; }
          if(proj<tMin) tMin=proj;
          if(proj>tMax) tMax=proj;
        }
      }
      /* 「その端で線を止めた」証拠があれば、はみ出し減点を免除する。
         ★免罪符には「その辺を描くに足る長さの、同方向の線の終点」を要求する。
         角に点や極小の線を置くだけでは資格が無い（旧実測: この条件なしだと
         突き抜け200%が 87.3点 → 99.6点 に化けた）。長さ資格は二値ではなく
         smoothstepで連続化し、1辺を3〜4分割して描く正直な癖に崖を作らない。 */
      const edgeLen=t.len||Math.hypot(t.pb.x-t.pa.x, t.pb.y-t.pa.y);
      const termAt=pt=>{ let b=0;
        for(const tm of termini){
          const lenW=smooth(0.07,0.25,edgeLen>0 ? tm.len/edgeLen : 0);
          if(lenW<=0) continue;
          const dot=Math.abs(tm.dx*ex+tm.dy*ey)/eL;
          if(dot<=DIR_COS0) continue;
          const dirW=Math.min(1,(dot-DIR_COS0)*DIR_NORM);
          const c=falloff(Math.hypot(tm.x-pt.x,tm.y-pt.y), t.tol)*dirW*lenW;
          if(c>b){ b=c; if(b>=0.999) break; }
        } return b; };
      const e0=Math.max(end0*overDamp(Math.max(0,-tMin)), termAt(t.pa));
      const e1=Math.max(end1*overDamp(Math.max(0,tMax-1)), termAt(t.pb));
      t.endScore=(e0+e1)/2;
      /* ★重ね描き（ヘッジ）課金の材料。「長さ違いの候補線を重ねて、どれかが角に
         当たるのを狙う」総当たりは、距離・方向・インク総量のどれでも正直な
         下描きと区別できない。唯一の違いは線の「終わり方」。
         ★判定はストロークの物理的な終端ではなく「回廊内の走行区間(run)の両端」で行う。
         物理終端を見ると、終端の向きを曲げるだけの偽装（フック）で判定から
         消えてしまう（実測: フック5%で課金ゼロ・97点）。runの途切れ位置は
         フックでは動かせない。各ストロークの run [minP,maxP] の両端がそれぞれ
           (a) 角へのコミット: 端の位置がどちらかの角の近く
               （falloff窓 1.5×tol の連続窓。8%の読み違えは6割方免除される）
           (b) 継ぎ目: その端のすぐ先から先へ続く別ストローク（辺の1/4以上）がある
               ＝分割描きの関節。自分の run に重なって戻る複製・ヘッジ仲間は相棒にならない
           (c) 圏外への抜け: 端が回廊圏外（proj≤-0.3/≥1.3）＝通り抜け・大はみ出し。
               こちらは既存のはみ出し減点系（overDamp）が清算する
         のどれかで説明できれば免除（両端の min を採る）。正直な一本描き・分割描き・
         なぞり直し・作図線はほぼ全額免除され、「角の位置を答えない、
         中途半端な長さの同方向の線」だけが積み上がる。 */
      let hedged=0,strongHedged=0;
      {
        const endMiss=function(p){
          if(p<=-0.3 || p>=1.3) return 0;                       // (c)
          return Math.min(Math.abs(p),Math.abs(p-1));
        };
        const endW=p=>falloff(endMiss(p)*eL,1.5*t.tol);         // (a)
        /* ★方向つきミス（断片課金用）。角の外側で止まった端（描き通し）は
           overDamp（はみ出し減点）が既に清算しているので半減重みにする。
           一本描きなら5%の描き通しが無料（OVER_FREE経済）なのに、分割描きだと
           断片課金で殺される非対称を避ける。内側で止まった端は満額。 */
        const endMissDir=function(p){
          if(p<=-0.3 || p>=1.3) return 0;
          const nearPb=Math.abs(p-1)<Math.abs(p);
          const miss=nearPb?Math.abs(p-1):Math.abs(p);
          const outward=nearPb ? p>1 : p<0;
          return outward ? 0.5*miss : miss;
        };
        /* 継ぎ目は「辺長の15%以内に別ストロークがある」だけでは認めない。
           その方式だと1本の補助線を、70/90/110/130%の複数候補の継続先として
           使い回し、ヘッジを0にできた。ここで実際の端点距離が近い組を一対一で
           マッチし、連結したrun全体の外端だけを判定する。 */
        /* ★流入runの隔離。隣接辺のストロークは共有角の近くで回廊に入り込み、
           [1, 1.26] のような「角の外へ伸びるrun」になる。インクを answerInk で
           免除しても、継ぎ目グラフに参加させると正直なチェーンと共有角（距離0）で
           連結し、成分の外端を角の外へ引きずって角免除を壊していた
           （実測: 2分割×2周が構図依存で54〜78点、12シード中5つで発生）。
           所有先が別の辺のストロークのrunは、ペアにも外端にも一切参加させない。
           そのインクの申し開きは所有先の辺で行われるため二重評価にもならない。 */
        const runs=[...corMap].filter(([si,c])=>{
            if(!(c.ink>0)) return false;
            const owner=strokeOwners.get(si);
            return !(owner && owner.ti!==ti);
          })
          .map(([si,c])=>({si,...c,guide:guideScore.get(si)||0}));
        /* ★横断コミット（一筆書き・重ねなぞりの保護）。両角を濃いインクで覆い、
           かつストロークの4割以上が回廊の外（＝他の辺を描いている）run は
           「この辺を通り抜けながら描いた答え」として committed と同格に扱う。
           一筆書きは角で折れる際に方向ブレンドで run の端が角の外へ滲み、
           成分の外端評価では構図依存で角免除を失っていた（実測: ×2周で58点）。
           長さ候補（回廊内にストロークの9割がある）や、角の先で曲げるフック偽装は
           「他の辺を実際に描く」条件を満たせない。偽装するには本当に他の辺を
           描くしかなく、その場合は偽装ではなく作画になる。 */
        /* 判定は投影窓ではなく「runの境界点が両方の真の角の近くにあるか」で行う。
           一筆書きは角で折れる際の方向ブレンドで run が角の手前で途切れるが、
           途切れる位置は角の近傍（構図によって深さが変わる）なので、
           物理距離 1.2×tol ならどの構図でも安定して掴める。
           縮小相似のアウトライン（候補立方体の重ね描き）は角が内側へ
           ずれるため、tol解像度を超えた縮小はここで自然に弾かれる。 */
        for(const rn of runs){
          const byTarget=strokeTargetInk.get(rn.si);
          const drawsAnother=byTarget && round.targets.some((t2,tj)=>{
            if(tj===ti || t2.pts) return false;
            const len=t2.len||Math.hypot(t2.pb.x-t2.pa.x,t2.pb.y-t2.pa.y);
            return byTarget[tj]>=0.8*len;
          });
          rn.traversal = !!drawsAnother && rn.ink>=0.8*eL &&
            Math.hypot(rn.minPt.x-t.pa.x,rn.minPt.y-t.pa.y)<=1.2*t.tol &&
            Math.hypot(rn.maxPt.x-t.pb.x,rn.maxPt.y-t.pb.y)<=1.2*t.tol &&
            (strokeLen.get(rn.si)||0) >= 1.67*rn.ink;
          /* greedy の同着順を描画順ではなく量子化済みの幾何で固定する。
             1/8論理単位未満は採点上同一とし、端末の丸め誤差も吸収する。 */
          rn.orderKey=[
            Math.round(rn.minP*eL*8),Math.round(rn.maxP*eL*8),
            Math.round(rn.minPt.x*8),Math.round(rn.minPt.y*8),
            Math.round(rn.maxPt.x*8),Math.round(rn.maxPt.y*8),
            Math.round(rn.ink*8),Math.round((strokeLen.get(rn.si)||0)*8),
            Math.round(rn.guide*1024),committedStroke.has(rn.si)?1:0,rn.traversal?1:0,
          ];
        }
        const compareRun=(a,b)=>{
          for(let k=0;k<a.orderKey.length;k++){
            const d=a.orderKey[k]-b.orderKey[k]; if(d) return d;
          }
          return 0;
        };
        runs.sort(compareRun);
        const parent=runs.map((_,i)=>i);
        const root=i=>{ while(parent[i]!==i){ parent[i]=parent[parent[i]]; i=parent[i]; } return i; };
        const unite=(a,b)=>{ a=root(a); b=root(b); if(a!==b) parent[b]=a; };
        const joinGap=Math.min(8,Math.max(3,0.75*t.tol));        // 論理座標。普通の分割描画は保護
        const joinProj=eL>1e-6 ? joinGap/eL+1e-9 : 0;
        const pairs=[];
        for(let i=0;i<runs.length;i++) for(let j=0;j<runs.length;j++){
          if(i===j) continue;
          const a=runs[i], b=runs[j];                           // aの高い側 → bの低い側
          if(Math.abs(a.maxP-b.minP)>joinProj) continue;
          const d=Math.hypot(a.maxPt.x-b.minPt.x,a.maxPt.y-b.minPt.y);
          if(d<=joinGap) pairs.push({i,j,d});
        }
        /* ★距離を1/8論理単位へ量子化してからソートする。浮動小数の同着(±1e-13)が
           端末間で greedy の組み方を変え、採点の端末非依存を破っていた
           （実測: 同一入力で mobile 4.46 / desktop 5.73）。同着は列挙順で確定。 */
        pairs.sort((a,b)=>(Math.round(a.d*8)-Math.round(b.d*8)) || (a.i-b.i) || (a.j-b.j));
        /* greedy接続のhard境界を断片課金へ直接伝えない。joinGapの近傍で
           0→1に切り替わると、同じ3分割のノイズ差0.001%で60点落ちた。
           接続に選ばれなかった端も「近くに継続先がある」度合いを連続値で残す。 */
        const lowJoinW=runs.map(()=>0), highJoinW=runs.map(()=>0);
        for(let i=0;i<runs.length;i++) for(let j=0;j<runs.length;j++){
          if(i===j) continue;
          const a=runs[i],b=runs[j];
          const projGap=Math.abs(a.maxP-b.minP)*eL;
          const pointGap=Math.hypot(a.maxPt.x-b.minPt.x,a.maxPt.y-b.minPt.y);
          const gap=Math.max(projGap,pointGap);
          const w=1-smooth(0.75*joinGap,1.75*joinGap,gap);
          if(w>highJoinW[i]) highJoinW[i]=w;
          if(w>lowJoinW[j]) lowJoinW[j]=w;
        }
        const highUsed=new Set(), lowUsed=new Set();
        for(const q of pairs){
          if(highUsed.has(q.i)||lowUsed.has(q.j)) continue;     // 同じ端点の使い回しを禁止
          highUsed.add(q.i); lowUsed.add(q.j); unite(q.i,q.j);
        }
        const comps=new Map();
        for(let i=0;i<runs.length;i++){
          const r=root(i); if(!comps.has(r)) comps.set(r,{ink:0,guideInk:0,answerInk:0,
            strictAnswerInk:0,
            frag:0,ends:[],minP:Infinity,maxP:-Infinity,minPt:null,maxPt:null});
          const c=comps.get(r), q=runs[i];
          c.ink+=q.ink; c.guideInk+=q.ink*q.guide;
          if(q.minP<c.minP){ c.minP=q.minP; c.minPt=q.minPt; }
          if(q.maxP>c.maxP){ c.maxP=q.maxP; c.maxPt=q.maxPt; }
          if(committedStroke.has(q.si)||q.traversal) c.answerInk+=q.ink;
          else if(q.ink>=0.07*eL) c.frag+=1-0.5*(lowJoinW[i]+highJoinW[i]);
          if(strictCommittedStroke.has(ti+":"+q.si)) c.strictAnswerInk+=q.ink;
          if(!lowUsed.has(i))  c.ends.push({p:q.minP, pt:q.minPt});
          if(!highUsed.has(i)) c.ends.push({p:q.maxP, pt:q.maxPt});
        }
        let fragUnexplained=0;
        /* ★同じ答えのなぞり直しは一回分に近づける。
           従来は成分ごとに未コミット課金を合算したため、同じ線を3周なぞる
           正直な癖が3倍の課金になった。下流で端点・横位置の類似度を連続量にし、
           同じ経路は割り引き、長さや位置が違う候補は滑らかに合算へ戻す。 */
        const records=[];
        for(const c of comps.values()){
          const chargeInk=Math.max(0,c.ink-c.answerInk);
          /* 一対一接続なので成分はpath（外端2つ）かcycle（外端0）になる。
             cycleを二値で全額課金すると、線長がjoinGapを最小量だけ跨いだ瞬間に
             pathへ変わり大きな点差が出る。cycleにも全runの物理的な最小・最大端を
             仮想外端として与え、pathと同じ連続式へ流す。その他の不整合だけ全額。 */
          let lo,hi;
          if(c.ends.length===2){
            c.ends.sort((a,b)=>a.p-b.p); lo=c.ends[0]; hi=c.ends[1];
          }else if(c.ends.length===0 && c.minPt && c.maxPt){
            lo={p:c.minP,pt:c.minPt}; hi={p:c.maxP,pt:c.maxPt};
          }else{
            hedged+=chargeInk; fragUnexplained+=c.frag;
            continue;
          }
          const w=Math.min(endW(lo.p),endW(hi.p));
          /* 断片の重みはミス比で連続化（ランプ幅と方向扱いはクラスタ集計後に決める）。
             missDir=外方向半減（正直な描き通し用）、missRaw=方向無差別（ヘッジ用）。 */
          const span=hi.p-lo.p;
          records.push({lo:lo.p, hi:hi.p, loPt:lo.pt, hiPt:hi.pt, ink:c.ink,
                         charge:chargeInk*(1-w), frag:c.frag, span,
                         guide:c.ink>0?c.guideInk/c.ink:0,
                         strictAnswer:c.ink>0&&c.strictAnswerInk>=0.95*c.ink,
                        /* 両角を一つの答えとして結ぶ成分ほど、なぞり直し類似度の
                           割引対象にする。中央で切れた候補片まで強く割り引くと、
                           少しずつ長さを変えた候補を何本置いても一回分に近づく。 */
                        redrawW:smooth(0.60,0.78,span),
                        loLat:((lo.pt.x-t.pa.x)*ey-(lo.pt.y-t.pa.y)*ex)/Math.max(1e-6,eL),
                        hiLat:((hi.pt.x-t.pa.x)*ey-(hi.pt.y-t.pa.y)*ex)/Math.max(1e-6,eL),
                        missDir:Math.max(endMissDir(lo.p),endMissDir(hi.p)),
                        missRaw:Math.max(endMiss(lo.p),endMiss(hi.p))});
        }
        /* なぞり直しの連続集計。
           旧クラスタは「近い/別」を hard な距離比較で決めたため、端点を0.01%動かす
           だけで3周が1群→3群となり、約80点落ちる境界を作った。ここでは各組の
           近さを0〜1の similarity にし、各成分の寄与を近い仲間の実効数で割る。
           N本が完全一致なら合計は一回分、離れるほど滑らかにN回分へ戻る。
           投影方向と横方向を分離するのは、縦の止め位置ノイズを物理距離でも二重に
           数えず、別の平行経路だけは確実に区別するため。 */
        let candidateEvidence=0;
        {
          records.sort((a,b)=>(a.lo-b.lo)||(a.hi-b.hi)||(a.loLat-b.loLat)||(a.hiLat-b.hiLat));
          const projUnit=Math.max(1e-6,Math.min(0.8*t.tol,0.08*eL));
          const latUnit=Math.max(1e-6,Math.min(0.35*t.tol,0.05*eL));
          const redundancy=records.map(()=>1);
          for(let i=0;i<records.length;i++) for(let j=i+1;j<records.length;j++){
            const a=records[i], b=records[j];
            const projD=Math.max(Math.abs(a.lo-b.lo),Math.abs(a.hi-b.hi))*eL/projUnit;
            const latD=Math.max(Math.abs(a.loLat-b.loLat),Math.abs(a.hiLat-b.hiLat))/latUnit;
            const d=Math.max(projD,latD);
            const similarity=Math.exp(-2*d*d*d*d)*Math.min(a.redrawW,b.redrawW);
            redundancy[i]+=similarity; redundancy[j]+=similarity;
          }
          /* ★答えの多様性は hard な D=2/3 ではなく連続量で扱う。
             旧 D は missRaw=1.5% または回廊インク55%を最下位bitだけ跨いでも、
             全クラスタのランプを一斉に切り替え、100点→0点級の崖を作った。
             ここでは「十分なspanを持ち、角を外した答え」の証拠を smoothstep で
             足し合わせ、正直ランプとヘッジランプを連続補間する。 */
          const diversity=records.reduce((sum,rec,i)=>sum+
            smooth(0.45,0.65,rec.span)*smooth(0.005,0.035,rec.missRaw)/redundancy[i],0);
          const hedgeMix=smooth(2.0,2.8,diversity);
          /* 実効質量は、完全一致した正当ななぞり直しを一群として数えつつ、
             少しずつ位置・長さを変えた候補は連続的に追加質量へ戻す。 */
          const redrawMass=records.reduce((sum,rec,i)=>sum+
            rec.redrawW*(0.60+0.40/redundancy[i]),0);
          candidateEvidence=records.reduce((sum,rec,i)=>sum+
            smooth(0.45,0.65,rec.span)*(rec.strictAnswer?0:1)*
            (1-0.90*rec.guide)/redundancy[i],0);
          /* 近接した長い成分を重ね、pairwise割引の分母だけを増やす攻撃を防ぐ。
             正当な数回のなぞり直しは質量予算3で保護し、実効質量の超過分を課金する。 */
          hedged+=1.50*eL*Math.max(0,redrawMass-3);
          for(let i=0;i<records.length;i++){ const rec=records[i];
            /* spanの短い候補片は redrawW≈0 なので割引されず全て合算される。
               これにより中央gapで候補数を近接群へ隠す抜け道を塞ぐ。 */
            hedged+=rec.charge/redundancy[i];
            const honestW=clamp((rec.missDir-0.02)/0.08,0,1);
            const hedgeW=clamp((rec.missRaw-0.01)/0.025,0,1);
            fragUnexplained += rec.frag/redundancy[i]*
              ((1-hedgeMix)*honestW+hedgeMix*hedgeW);
          }
          /* 3つ目以降の独立した長さ候補には、分割数に依存しない最低費用を置く。
             frag>6だけに頼ると、各候補を一本で描くK3が無罰になっていた。 */
          /* 3候補以上に相当する多様性は、描き直しとは区別できる強い証拠。 */
          { const v=1.70*hedgeMix*eL; hedged+=v; strongHedged+=v; }
        }
        /* 端点を答えず回廊を通過する線は、位置クラスタや本数のhard gateではなく
           実効インク総量で連続課金する。ストローク内のrun量を合算して物理長を
           上限にするため、隣接辺への流入を抑えつつ継ぎ足しも証拠として残せる。
           補助線らしさは90%控除し、正当な通過線2本程度までは保護する。 */
        const rawPass=runs.filter(r=>
          !committedStroke.has(r.si) && !r.traversal && r.ink>=0.07*eL &&
          (r.minP<=-0.3 || r.maxP>=1.3));
        /* 一つのストロークが辺の外で継ぎ足され、同じ回廊へ複数runとして戻る
           攻撃もあるため、runを単純maxにしない。ストローク内はrun量を合算し、
           物理的なストローク長を上限にする。これなら隣接辺流入の二重計上を抑えつつ、
           gap6/gap8の枠外継ぎ足しは証拠として残る。 */
        const passByStroke=new Map();
        for(const r of rawPass){
          const effective=r.ink*(1-0.90*r.guide);
          passByStroke.set(r.si,(passByStroke.get(r.si)||0)+effective);
        }
        let passEvidence=0;
        for(const [si,ink] of passByStroke)
          passEvidence+=Math.min(ink,strokeLen.get(si)||ink);
        /* 通過線の通常課金は従来どおり2.2本分から。ただし二度なぞる癖まで
           「明白」とは扱わず、強証拠は2.6本分を越えた量（ほぼ3本以上）だけ。 */
        { const v=1.40*Math.max(0,passEvidence-2.2*eL);
          const strongV=1.40*Math.max(0,passEvidence-2.6*eL);
          hedged+=v; strongHedged+=strongV; }
        /* gap攻撃は各候補の中央run自体が枠内に残るため、pass量だけでは
           捕まらない。二つ目以降の独立候補から連続的に最低費用を立ち上げる。
           K3 gridの最小evidenceは約1.91で、2から開始する旧案には抜けがあった。 */
        hedged+=eL*(1.70*smooth(1.0,2.0,candidateEvidence)
                     +0.70*Math.max(0,candidateEvidence-3));
        /* 同じ辺の中央を、長さだけ変えて何本も重ねる「候補線」は、端点を答えずに
           当たりを待つ描き方になる。連続した分割描画とは違い、区間同士が大きく重なるので
           長い重複ペアだけを小さく加算する。正解辺を端から端まで引いた線（committed）と、
           枠外まで伸ばす通常のアタリ線（pass）は対象外。2本程度の描き直しでは最終的な
           無料域をほぼ越えず、70/90/110/130%の4択だけを確実に識別できる。 */
        const candidates=runs.filter(r=>{
          const span=r.maxP-r.minP;
          return !committedStroke.has(r.si) &&
                 r.ink>=0.5*eL && span>=0.5 && r.minP>-0.3 && r.maxP<1.3;
        });
        let overlapPairs=0;
        for(let i=0;i<candidates.length;i++) for(let j=i+1;j<candidates.length;j++){
          const a=candidates[i], b=candidates[j];
          const overlap=Math.min(a.maxP,b.maxP)-Math.max(a.minP,b.minP);
          const shorter=Math.min(a.maxP-a.minP,b.maxP-b.minP);
          if(shorter>0 && overlap>=0.7*shorter) overlapPairs++;
        }
        hedged+=0.030*overlapPairs*eL;
        /* ★断片課金は「端の説明がつかない成分」の断片だけを数える（fragUnexplained、
           上の成分ループで集計）。旧実装は raw のrun数>6 を課金したため、
           3分割×3周（9本/辺）のような正直な重ね描きが死んでいた。
           両端が角か継ぎ目で説明できた成分の断片は正当な分割チェーンなので数えない。
           K4の各候補へ継ぎ目用の別線を添える攻撃（12本/辺）は、成分の端が
           宙に浮いたままなので従来どおりここで捕まる。7%辺長未満のノイズは対象外。 */
        /* 断片無料枠もhardな折れ点にしない。旧式はfragが6を最小量だけ跨ぐと、
           後段のhedge無料枠と指数減衰が重なり60点級の崖を再構成した。
           5.5〜7.0の滑らかな立ち上がりへ広げ、十分多い断片では旧式と同じ
           0.75/fragの傾きへ戻す。 */
        const fragExcess=Math.max(0,fragUnexplained-6);
        hedged+=0.75*eL*(fragExcess*smooth(5.5,7.0,fragUnexplained)
                        +0.25*smooth(5.5,7.0,fragUnexplained));
      }
      t.hedgedMult = eL>1e-6 ? hedged/eL : 0;   // 「答えない線」の実効なぞり回数
      t.strongHedgedMult = eL>1e-6 ? strongHedged/eL : 0;
    }
    covSum += t.score;
  }
  const cov = round.targets.length ? covSum/round.targets.length : 0;
  /* 固定カメラから投影した「真の立方体モデル」への構造適合。
     辺の途中をなぞるだけでなく、両端の頂点まで接続できているかを幾何平均で見る。
     消失点だけが合う短い／長い直方体は、端点が合わないのでここで下がる。 */
  const structure = round.targets.length
    ? round.targets.reduce((a,t)=>a+Math.sqrt(Math.max(0,t.score*t.endScore)),0)/round.targets.length
    : 0;
  /* 的中率は「立方体の周辺に引かれた線」だけで評価する。
     消失点をとるために遠くまで伸ばしたアタリ線は、加点も減点もしない。
     （guideScore・boxes はターゲットループより前で計算済み） */
  /* ★立方体の外へ出たインクの扱い。
     消失点まで伸ばすアタリ線は「無罪」でよいが、それを無条件にすると
     箱の外へ逃がしただけのインクが全部タダになる。実測: 各頂点から45°刻みで
     8方向へ辺の長さだけ放射する「ばらまき」は、外へ出た分(2.67倍)が全額無視され
     eff=0.91・76点で通っていた。
     そこで補助線らしさに応じて連続的に軽減し、それ以外の箱外インクは半額で数える。
     正直に描く人は箱外インクが0なので影響なし。 */
  const FAR_W = 0.5;
  let pSum=0, pN=0, waste=0, farN=0;
  for(const p of sp){
    const g=guideScore.get(p.si)||0;
    if(!inBox(p)){                       // 立方体から離れた線＝補助線として別に数える
      farN++;
      waste += FAR_W*(1-g);
      continue;
    }
    let best=Infinity, tol=20;
    for(const g of round.allSegs){
      const d=distToSeg(p.x,p.y,g.pa.x,g.pa.y,g.pb.x,g.pb.y);
      if(d<best){ best=d; tol=g.tol; }
    }
    const hit=falloff(best, tol);
    const w=1-g*(1-GUIDE_W);
    pSum += hit*w; pN += w;
    waste += (1-hit)*(1-g*(1-GUIDE_WASTE_W)); // 補助線らしさに応じて20〜100%
  }
  const prec = pN ? pSum/pN : 0;
  const needLen = round.targets.reduce((a,t)=>
    a+(t.len||Math.hypot(t.pb.x-t.pa.x, t.pb.y-t.pa.y)), 0);
  /* ★基準は「そのラウンドで描くべき線の総長」。
     以前は全12辺（＝描くべき量の3〜7倍）を基準にしていたため許容が緩すぎ、
     「答えの候補を何通りもばらまいて、どれかが当たるのを狙う」やり方が
     ほぼ無罰で通っていた（実測: 候補8〜10本ばらまきで88〜93点）。
     waste は allSegs から外れたインクだけを数えるので、この変更をしても
     ハリガネのように隠れ辺まで全部描く人・正しいアタリ線を引く人は減点されない
     （どちらも allSegs の上に乗るため waste に入らない）。 */
  const baseLen = needLen + (round.extraLen||0);
  /* ★効率系（waste/overdraw/hedge）の分母は立方体スケールを下限にする。
     2面ビューの回は描くべき辺が短く baseLen が半分以下になるため、同じ本数の
     正しい作図線が3辺の回だけ2倍以上の比率で課金され、8本で-40点の格差が出ていた
     （5辺の回では同じ絵が無料）。無駄インクの「多い・少ない」は課題の長さではなく
     立方体の大きさに対する感覚なので、ヒント面スケール×2.4 を下限に敷く。
     cov/structure/prec は従来どおり課題基準のまま。 */
  const effBase = Math.max(baseLen, 2.4*HINT_FACE_SIZE);
  /* 正解線上へ候補を大量に重ねる総当たりは、距離誤差だけでは見分けられない。
     正解の1.6倍までは下描き・隠れ線として無料、それを超えた分だけ緩やかに加算する。
     高確度の補助線は長さの90%を免除するので、通常の消失点作図はほぼ影響しない。 */
  /* 免除は「補助線らしさ×長さ」の合計を、予算(guideBudget)を上限に90%まで。
     予算内なら旧式の Σ L×(1-0.9g) と同値。予算超過は超過分だけが素通しになり、
     なだらかに効き始める（guideScore 自体は縮めないので waste/prec 側は無傷）。 */
  let inkTotal=0, guideDemand=0;
  for(const [si,L] of strokeLen){ inkTotal+=L; guideDemand+=(guideScore.get(si)||0)*L; }
  const effectiveInk=inkTotal-0.90*Math.min(guideDemand,guideBudget);
  const overdraw=effBase>0 ? Math.max(0,effectiveInk/effBase-1.6)*0.12 : 0;
  /* ★ヘッジ課金。各辺の回廊にたまった「角も答えず通り抜けもしない」同方向インク
     （t.hedgedMult、上のターゲットループで算出）のうち、辺0.9本ぶんを超えた分に
     0.5/辺長を課す。正直な描き方は run の端が角に付くか回廊を抜けるかのどちらかなので
     ほぼ全額免除され、長さ違いの候補を並べる総当たりだけが積み上がる。
     無料枠0.9は「角を大きく読み違えた一本描き」を必ず無傷で通すための保険
     （25%短い一本描きでも charged≈0.73 で枠内）。 */
  let hedgeExcess=0,strongHedgeMass=0;
  for(const t of round.targets){
    if(t.pts) continue;
    const len=t.len||Math.hypot(t.pb.x-t.pa.x,t.pb.y-t.pa.y);
    if(t.hedgedMult>0.9) hedgeExcess += (t.hedgedMult-0.9)*len;
    strongHedgeMass += Math.max(0,t.strongHedgedMult||0)*len;
  }
  const hedgeRaw = effBase>0 ? 0.5*hedgeExcess/effBase : 0;
  const strongHedgeRaw = effBase>0 ? 0.5*strongHedgeMass/effBase : 0;
  /* honest-first 方針:
     描き直しと複数候補は、最終画像だけでは確実に区別できない。ここを強く罰すると
     正解辺がすべて緑でも数点まで落ちるため、曖昧証拠による減点は最大2%に限定する。 */
  const ambiguousHedgePenalty = 0.02*smooth(0.04,0.40,hedgeRaw);
  /* 強証拠には小さな0.08の猶予だけを置く。総量側と二重課金せず、
     どちらか強い方を採る。 */
  const clearHedge = Math.max(Math.max(0,hedgeRaw-0.40),
                              Math.max(0,strongHedgeRaw-0.08));
  const hedge = ambiguousHedgePenalty+clearHedge;  // 検証・表示用の連続した総量
  const inkRatio = effBase>0 ? waste*step/effBase+overdraw : 0;   // 外れ＋過剰インクの比
  /* 遠く外れた線・過剰な総インクは従来どおり waste で減点する。一方、候補数だけを
     根拠にした指数罰は、正常な輪郭の描き直しにも同じ反応をするため採点には使わない。
     clearHedge は検証用診断値として残し、不正対策より正常入力の公平性を優先する。 */
  const eff = (inkRatio>WASTE_ALLOW ? WASTE_ALLOW/inkRatio : 1)
            * (1-ambiguousHedgePenalty);
  /* 高得点帯は正解投影への厳密な一致を従来どおり評価する。一方、全辺を別々の
     直線で一貫して結んだ「立方体として読める形」は recognitionFloor による
     最大24点の下限だけを持つ。これにより同じ距離誤差の二重減点を低得点帯で止め、
     中〜高得点や攻略防御の序列は変えない。 */
  /* coverage と端点構造は同じ位置ずれを別方向から見るため、端を早めに止めた
     一筆描きでは同じ誤差を二重に掛けていた。structure の実測値・結果表示は
     保ったまま、採点用だけ coverage の80%を下限にする。8〜10%の止め癖は
     ほぼそのまま、15〜20%の大きな止め癖だけ二重罰を4〜7点ほど緩和する。 */
  const structureForScore=Math.max(structure,0.80*cov);
  const modelFit = 0.55*cov + 0.30*structureForScore + 0.15*prec;
  /* 0.65では一発描きの通常誤差がv1.26より中間帯で3〜8点低くなった。
     0.50ならcareful/ordinary/looseの手描き分布が旧版とほぼ一致し、厳密一致・
     攻略防御・recognition下限を変えずに、過剰な中間帯圧縮だけを戻せる。 */
  const strictScore=100*Math.pow(cov,0.50)*modelFit*eff;
  const recognition=recognitionFloor(round,strokes,eff);
  const score=Math.round(100*Math.max(strictScore,recognition.score))/100;
  // まんまるの日は落書き判定を切る（「まるいね！でも今回は立方体だよ」が的外れになるため）
  const doodle = round.twist==="maru" ? null : doodleKind(round, strokes, cov, prec, needLen);
  /* 左右反転して描いてしまった人の検出（鏡の国の住人）。
     線を鏡像にして採点し直し、そちらの方が明らかに合っていれば反転ミスと判断する。
     ちゃんと描けている回は計算をスキップする。 */
  let mirrored=false;
  if(cov<0.5 && round.targets.length){
    /* 反転の軸は「ヒント面の左右の中心」。立方体全体のbbox中心だと奥行きの分だけ
       ずれてしまい判定できない。ダブルではキューブごとの軸を使う。 */
    const axes=round.cubes.map(c=>{
      const xs=CUBE_FACES[c.shown].idx.map(i=>c.P[i].x);
      return Math.min(...xs)+Math.max(...xs);   // 2*中心
    });
    let msum=0;
    for(const t of round.targets){
      const axis2=axes[t.cube];
      const cutM=3*t.tol+step, cutM2=cutM*cutM;
      let q=0;
      for(let si2=0;si2<t.samples.length;si2++){
        const s=t.samples[si2], sd=t._dirs[si2];
        let best=0;
        for(const g2 of segs){
          const mdx=(axis2-g2.mx)-s.x, mdy=g2.my-s.y;   // 線分をx反転して照合
          if(mdx*mdx+mdy*mdy>=cutM2) continue;
          const dot=Math.abs(-g2.dx*sd.x + g2.dy*sd.y);   // 向きも反転
          if(dot<=DIR_COS0) continue;
          const w=Math.min(1,(dot-DIR_COS0)*DIR_NORM);
          const c=falloff(distToSeg(s.x,s.y, axis2-g2.ax,g2.ay, axis2-g2.bx,g2.by), t.tol)*w;
          if(c>best){ best=c; if(best>=0.9995) break; }
        }
        q+=best;
      }
      msum += q/t.samples.length;
    }
    const mcov=msum/round.targets.length;
    mirrored = mcov>0.5 && mcov>cov+0.25;
  }
  return {score, cov, structure, modelFit, recognition, prec, eff, inkRatio, doodle, mirrored,
          gridish: gridKind(round, strokes, prec),      // グリッド／点打ちハックの検出（バッジ用）
          overdraw, hedge, hedgeRaw, strongHedgeRaw, ambiguousHedgePenalty, clearHedge,
          farInk: baseLen>0 ? farN*step/baseLen : 0};   // 補助線の量（描くべき線の総長に対する比）
}
const gradeOf = s => s>=88?"S":s>=72?"A":s>=55?"B":s>=35?"C":"D";

const TITLES_WIRE=[
  [99.2,"チート疑い","Are you Cheating?","🧀"],

/* ---- 紙吹雪 ---- */
const fx=(()=>{
  let c=null,g=null,parts=[],raf=null;
  function ensure(){
    if(!c){
      c=document.createElement("canvas");
      c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:55;";
      document.body.appendChild(c);
    }
    c.width=window.innerWidth; c.height=window.innerHeight;
    g=c.getContext("2d");
  }
  function tick(){
    raf=requestAnimationFrame(tick);
    g.clearRect(0,0,c.width,c.height);
    for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.r+=p.vr; }
    parts=parts.filter(p=>p.y<c.height+30);
    for(const p of parts){
      g.save(); g.translate(p.x,p.y); g.rotate(p.r);
      g.fillStyle=p.col; g.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66); g.restore();
    }
    if(!parts.length){ cancelAnimationFrame(raf); raf=null; g.clearRect(0,0,c.width,c.height); }
  }
  return { burst(n){
    ensure();
    const cols=["#ff8fb7","#a5d8ff","#c9f0dd","#e3d9ff","#f5b73d","#ffd6e7"];
    for(let i=0;i<n;i++) parts.push({
      x:Math.random()*c.width, y:-20-Math.random()*c.height*0.25,
      vx:(Math.random()-0.5)*2.6, vy:2+Math.random()*3.5,
      s:6+Math.random()*8, r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
      col:cols[i%cols.length],
    });
    if(!raf) tick();
  }};
})();

/* ================= canvas & rendering ================= */
const cv=$("#cv");
const ctx=cv.getContext("2d");
const ink=document.createElement("canvas");
const ictx=ink.getContext("2d");
let W=0,H=0,dpr=1;
let hideInk=false; // リプレイ用ベース画像キャプチャ時にインクを描かない

/* ================= 表示だけのズーム（ピンチ／ホイール） =================
   お題・ストローク・採点はすべて「ワールド座標」のまま。ズームは見え方だけを変える
   ので、拡大して描いても点数はまったく変わらない（有利にも不利にもならない）。
     画面座標 = ワールド座標 * viewS + (viewX, viewY) */
let viewS=1, viewX=0, viewY=0;
const VIEW_MIN=0.15, VIEW_MAX=4;
const toWorld = (sx,sy) => ({x:(sx-viewX)/viewS, y:(sy-viewY)/viewS});
// いま画面に映っているワールド座標の範囲
const viewWorldBox = () => ({l:-viewX/viewS, t:-viewY/viewS,
                             r:(W-viewX)/viewS, b:(H-viewY)/viewS});
function applyViewToInk(){
  ictx.setTransform(dpr*viewS,0,0,dpr*viewS, dpr*viewX, dpr*viewY);
  ictx.lineCap="round"; ictx.lineJoin="round"; ictx.strokeStyle="#5f6fd6";
}
function setView(s,x,y){
  viewS=clamp(s,VIEW_MIN,VIEW_MAX);
  /* 引きすぎ・寄せすぎで迷子にならないよう、画面のどこかに必ずお題が残るようにする */
  const pad=Math.min(W,H)*0.35;
  viewX=clamp(x, -(W*viewS)+pad, W-pad);
  viewY=clamp(y, -(H*viewS)+pad, H-pad);
  applyViewToInk(); rebuildInk();
  $("#btnZoomReset").classList.toggle("hidden", Math.abs(viewS-1)<0.01);
  render();
}
function resetView(){ if(viewS===1 && viewX===0 && viewY===0) return; setView(1,0,0); }
/* 一点を固定したまま倍率を変える（ピンチ・ホイールの共通処理） */
function zoomAt(sx,sy,ns){
  ns=clamp(ns,VIEW_MIN,VIEW_MAX);
  const w=toWorld(sx,sy);
  setView(ns, sx-w.x*ns, sy-w.y*ns);
}

function resizeCanvases(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  for(const c of [cv,ink]){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
  cv.style.width=W+"px"; cv.style.height=H+"px";
  applyViewToInk();
}

/* 消失点＝投影された平行辺どうしの交点。画面座標から直接求めるので、
   リサイズの相似変換やズームを掛けたあとでも正しい位置になる。
   画面上でほぼ平行な組（＝消失点が無限遠）は null を返す。
   戻り値の並びは PARALLEL_GROUPS と同じで、[0]と[2]が横方向、[1]が縦方向。 */
function vanishingPoints(c){
  return PARALLEL_GROUPS.map(g=>{
    // いちばん「平行から遠い」2辺を選ぶと交点が数値的に安定する
    let bi=null, bj=null, best=0;
    for(let i=0;i<g.length;i++) for(let j=i+1;j<g.length;j++){
      const d1={x:c.P[g[i][1]].x-c.P[g[i][0]].x, y:c.P[g[i][1]].y-c.P[g[i][0]].y};
      const d2={x:c.P[g[j][1]].x-c.P[g[j][0]].x, y:c.P[g[j][1]].y-c.P[g[j][0]].y};
      const L1=Math.hypot(d1.x,d1.y), L2=Math.hypot(d2.x,d2.y);
      if(L1<1e-6||L2<1e-6) continue;
      const cr=Math.abs((d1.x*d2.y-d1.y*d2.x)/(L1*L2));
      if(cr>best){ best=cr; bi=g[i]; bj=g[j]; }
    }
    if(!bi || best<2e-3) return null;          // 平行＝消失点は無限のかなた
    const p=c.P[bi[0]], q=c.P[bj[0]];
    const d1={x:c.P[bi[1]].x-p.x, y:c.P[bi[1]].y-p.y};
    const d2={x:c.P[bj[1]].x-q.x, y:c.P[bj[1]].y-q.y};
    const den=d1.x*d2.y-d1.y*d2.x;
    const t=((q.x-p.x)*d2.y-(q.y-p.y)*d2.x)/den;
    return {x:p.x+d1.x*t, y:p.y+d1.y*t};
  });
}
/* れんしゅうモードの答え合わせで、消失点とそこへ集まるパース線を見せる。
   消失点は画面外へ出ることが多いので、画面内なら丸印、画面外なら
   「この方向にあるよ」という印を画面のふちに置く。 */
function drawVanishingAid(){
  const c=round.cubes[0];
  const vps=vanishingPoints(c);
  ctx.save();
  // ① 各辺から消失点へのパース線
  ctx.setLineDash([5,7]); ctx.lineWidth=1.2;
  ctx.strokeStyle="rgba(122,106,184,.42)";
  vps.forEach((vp,gi)=>{
    if(!vp) return;
    for(const [a,b] of PARALLEL_GROUPS[gi]){
      const pa=c.P[a], pb=c.P[b];
      // 消失点に近いほうの端点から伸ばす（辺そのものは上書きしない）
      const near = Math.hypot(pa.x-vp.x,pa.y-vp.y) < Math.hypot(pb.x-vp.x,pb.y-vp.y) ? pa : pb;
      ctx.beginPath(); ctx.moveTo(near.x,near.y); ctx.lineTo(vp.x,vp.y); ctx.stroke();
    }
  });
  // ② 地平線（横向きの消失点2つを結ぶ線＝目線の高さ）
  if(vps[0] && vps[2]){
    ctx.setLineDash([12,8]); ctx.lineWidth=1.6;
    ctx.strokeStyle="rgba(58,160,148,.55)";
    const dx=vps[2].x-vps[0].x, dy=vps[2].y-vps[0].y;
    ctx.beginPath();
    ctx.moveTo(vps[0].x-dx*4, vps[0].y-dy*4);
    ctx.lineTo(vps[2].x+dx*4, vps[2].y+dy*4);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  // ③ 消失点そのもの。画面外なら、ふちに向きの印を出す
  const box=viewWorldBox(), m=26;
  vps.forEach(vp=>{
    if(!vp) return;
    const inside = vp.x>box.l+m && vp.x<box.r-m && vp.y>box.t+m && vp.y<box.b-m;
    if(inside){
      ctx.fillStyle="#7a6ab8";
      ctx.beginPath(); ctx.arc(vp.x,vp.y,6/viewS,0,7); ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=2/viewS; ctx.stroke();
    }else{
      // 立方体の中心から消失点へ向かう線が、画面のふちを横切る点に印を置く
      const cx=(box.l+box.r)/2, cy=(box.t+box.b)/2;
      let ux=vp.x-cx, uy=vp.y-cy;
      const L=Math.hypot(ux,uy); if(L<1e-6) return;
      ux/=L; uy/=L;
      let s=Infinity;
      if(ux>0) s=Math.min(s,(box.r-m-cx)/ux); else if(ux<0) s=Math.min(s,(box.l+m-cx)/ux);
      if(uy>0) s=Math.min(s,(box.b-m-cy)/uy); else if(uy<0) s=Math.min(s,(box.t+m-cy)/uy);
      if(!isFinite(s)||s<0) return;
      const ex=cx+ux*s, ey=cy+uy*s;
      ctx.fillStyle="rgba(122,106,184,.55)";
      ctx.beginPath(); ctx.arc(ex,ey,5/viewS,0,7); ctx.fill();
    }
  });
  ctx.restore();
}

function drawScene(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#fff9f2";
  ctx.fillRect(0,0,W,H);
  if(!round) return;
  // ここから先はワールド座標で描く（ズームは見え方だけの変換）
  ctx.setTransform(dpr*viewS,0,0,dpr*viewS, dpr*viewX, dpr*viewY);
  ctx.lineCap="round"; ctx.lineJoin="round";

  const showAnswer = (state==="roundResult");

  if(showAnswer){
    if(round.crossHidden){
      // りったい十字: 隠れた折り目を点線で（中心キューブの辺は形の内部なので描かない）
      ctx.strokeStyle="rgba(120,100,120,.3)"; ctx.lineWidth=1.5; ctx.setLineDash([3,6]);
      for(const g of round.crossHidden){
        ctx.beginPath(); ctx.moveTo(g.pa.x,g.pa.y); ctx.lineTo(g.pb.x,g.pb.y); ctx.stroke();
      }
      ctx.setLineDash([]);
    }else if(round.twist!=="maru") for(const c of round.cubes){   // まんまるの立方体は完全に見せない
      ctx.strokeStyle="rgba(120,100,120,.3)"; ctx.lineWidth=1.5; ctx.setLineDash([3,6]);
      for(const e of c.edges){
        if(e.inShown || e.visible) continue;
        if(round.mode==="wire") continue;
        ctx.beginPath(); ctx.moveTo(c.P[e.a].x,c.P[e.a].y); ctx.lineTo(c.P[e.b].x,c.P[e.b].y); ctx.stroke();
      }
      ctx.setLineDash([]);
    }
    for(const t of round.targets){
      const col = t.score>=0.78 ? "#4fbf7f" : t.score>=0.45 ? "#f0a24f" : "#ef6e8a";
      ctx.strokeStyle=col; ctx.lineWidth=3;
      ctx.setLineDash(t.hidden?[7,7]:[]);
      ctx.beginPath();
      if(t.pts){ ctx.moveTo(t.pts[0].x,t.pts[0].y);            // ポリライン（楕円など）
        for(let i=1;i<t.pts.length;i++) ctx.lineTo(t.pts[i].x,t.pts[i].y); }
      else { ctx.moveTo(t.pa.x,t.pa.y); ctx.lineTo(t.pb.x,t.pb.y); }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }else if(round.practice){
    for(const t of round.targets){
      ctx.strokeStyle="rgba(214,137,159,.42)"; ctx.lineWidth=2;
      ctx.setLineDash(t.hidden?[2,7]:[7,7]);
      ctx.beginPath();
      if(t.pts){ ctx.moveTo(t.pts[0].x,t.pts[0].y);
        for(let i=1;i<t.pts.length;i++) ctx.lineTo(t.pts[i].x,t.pts[i].y); }
      else { ctx.moveTo(t.pa.x,t.pa.y); ctx.lineTo(t.pb.x,t.pb.y); }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  if(!round.noCube) for(const c of round.cubes){
    const f=CUBE_FACES[c.shown];
    ctx.beginPath();
    f.idx.forEach((vi,i)=> i?ctx.lineTo(c.P[vi].x,c.P[vi].y):ctx.moveTo(c.P[vi].x,c.P[vi].y));
    ctx.closePath();
    ctx.fillStyle="rgba(255,143,183,.13)"; ctx.fill();
    ctx.strokeStyle="#54455a"; ctx.lineWidth=3; ctx.stroke();
  }

  // 変化球のヒント線（ヒント面の十字や目、円柱のフタはお手本として最初から見せる）。
  // 各要素は点の配列（2点なら線分、21点なら楕円ポリライン）。
  // noCube（円柱）のときは最初のヒント＝フタの楕円を面と同じ色で塗る
  if(round.hintLines){
    round.hintLines.forEach((hl,hi)=>{
      ctx.beginPath(); ctx.moveTo(hl[0].x,hl[0].y);
      for(let i=1;i<hl.length;i++) ctx.lineTo(hl[i].x,hl[i].y);
      if(round.noCube && hi===0){
        ctx.closePath();
        ctx.fillStyle="rgba(255,143,183,.13)"; ctx.fill();
      }
      ctx.strokeStyle="#54455a"; ctx.lineWidth=round.noCube?3:2.5;
      ctx.stroke();
    });
  }

  // れんしゅうモードでは、答え合わせと一緒に消失点とパース線を見せる
  if(showAnswer && studyRun) drawVanishingAid();

  if(!hideInk){
    // インクは ictx 側でズーム済みなので、ここは画面座標のまま等倍で貼る
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalAlpha = showAnswer?0.4:1;
    ctx.drawImage(ink,0,0,ink.width,ink.height,0,0,W,H);
    ctx.globalAlpha = 1;
    ctx.setTransform(dpr*viewS,0,0,dpr*viewS, dpr*viewX, dpr*viewY);
  }

  // eraser radius indicator
  if(state==="draw" && tool==="eraser" && hoverPos){
    ctx.strokeStyle="rgba(232,111,158,.7)"; ctx.lineWidth=1.5; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.arc(hoverPos.x,hoverPos.y,eraserR(),0,7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="rgba(255,179,199,.15)";
    ctx.beginPath(); ctx.arc(hoverPos.x,hoverPos.y,eraserR(),0,7); ctx.fill();
  }
}
let rafPending=false;
function render(){
  if(rafPending) return;
  rafPending=true;
  requestAnimationFrame(()=>{ rafPending=false; drawScene(); });
}

/* ================= strokes / eraser / history ================= */
let strokes=[], cur=null, activeId=null, lastPenAt=-1e9;
/* 描画中ポインタの生存確認用。pointerup を取りこぼしても復帰できるようにする
   （画面端でペンが範囲外に出ると pointerup が来ないことがある） */
let captureOk=false, lastActiveAt=0;
let tool="pen";              // "pen" | "eraser"
let hoverPos=null;           // eraser indicator
let erasing=false, eraseChanged=false, erasePrev=null;
let eraseUses=0;   // このラウンドで消しゴムを使った回数（かくし称号の判定用）
let undoKeyUses=0, undoBtnUses=0;   // Ctrl+Z とボタンでの取り消し回数（同上）
let clearUses=0;                    // このラウンドで「ぜんぶけす」を使った回数（同上）
/* 1ランを通して、どの入力デバイスで描いたかを点の数で重み付けして数える。
   途中で持ち替えても代表を1つ決められるようにするため（本数で数えると
   短い誤タップが重く出てしまうので、点の数で数える）。 */
let inputPts={};
let history=[];

const mid=(a,b)=>({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
/* 保存する w は「画面で見た太さ」。実際に塗るときだけ現在の倍率で割る
   （データに /viewS を焼き込むと、等倍で描き直すサムネイル・シェア画像・リプレイで太さが狂う） */
function segWidth(a,b){ return ((a.w+b.w)/2)/viewS; }
function drawLiveSegment(pts){
  const n=pts.length;
  if(n===2){
    ictx.lineWidth=segWidth(pts[0],pts[1]);
    ictx.beginPath(); ictx.moveTo(pts[0].x,pts[0].y);
    const m=mid(pts[0],pts[1]); ictx.lineTo(m.x,m.y); ictx.stroke();
  }else if(n>=3){
    const m0=mid(pts[n-3],pts[n-2]), m1=mid(pts[n-2],pts[n-1]);
    ictx.lineWidth=segWidth(pts[n-2],pts[n-1]);
    ictx.beginPath(); ictx.moveTo(m0.x,m0.y);
    ictx.quadraticCurveTo(pts[n-2].x,pts[n-2].y,m1.x,m1.y); ictx.stroke();
  }
}
function finishStrokeInk(pts){
  const n=pts.length;
  if(n===1){
    ictx.beginPath(); ictx.arc(pts[0].x,pts[0].y,pts[0].w/2/viewS,0,7);
    ictx.fillStyle="#5f6fd6"; ictx.fill();
  }else if(n>=2){
    const m=mid(pts[n-2],pts[n-1]);
    ictx.lineWidth=pts[n-1].w/viewS;
    ictx.beginPath(); ictx.moveTo(m.x,m.y); ictx.lineTo(pts[n-1].x,pts[n-1].y); ictx.stroke();
  }
}
function rebuildInk(){
  ictx.save(); ictx.setTransform(1,0,0,1,0,0);
  ictx.clearRect(0,0,ink.width,ink.height); ictx.restore();
  for(const s of strokes){
    for(let i=2;i<=s.pts.length;i++) drawLiveSegment(s.pts.slice(0,i));
    finishStrokeInk(s.pts);
  }
  /* 描いている最中の線も描き直す。これが無いと、線を引きながらズーム／リサイズ
     したときに引きかけの線が消えて二度と戻らない（末端のキャップは描画中なので付けない） */
  if(cur && cur.pts.length>1)
    for(let i=2;i<=cur.pts.length;i++) drawLiveSegment(cur.pts.slice(0,i));
}
function pushHistory(){
  history.push(strokes.map(s=>({pts:s.pts})));
  if(history.length>60) history.shift();
}
/* byKey=true はキーボード(Ctrl+Z)から。ボタンとキーの使い分けを数えて称号に使う。
   実際に戻せたときだけ数える（履歴が空の空振りは数えない） */
function undo(byKey){
  // inputFrozen: 3・2・1カウントダウン中はキーボード(Ctrl+Z)からも編集させない
  if(state!=="draw" || !history.length || activeId!==null || inputFrozen()) return;
  strokes=history.pop();
  if(byKey) undoKeyUses++; else undoBtnUses++;
  Sound.undo();
  rebuildInk(); render();
}
function clearAll(){
  if(state!=="draw" || !strokes.length || activeId!==null || inputFrozen()) return;
  pushHistory();
  strokes=[];
  clearUses++;                 // 実際に消せたときだけ数える
  Sound.clearAll();
  rebuildInk(); render();
}
function setTool(t, silent){
  if(tool===t) return;
  tool=t;
  cv.classList.toggle("pen", t==="pen");
  cv.classList.toggle("eraser", t==="eraser");
  $("#btnPen").classList.toggle("active", t==="pen");
  $("#btnEraser").classList.toggle("active", t==="eraser");
  if(!silent) t==="pen" ? Sound.pencil() : Sound.eraser();
  render();
}
/* insert points so consecutive stroke points are ≤6px apart —
   makes point-based erasing behave like true segment erasing */
function densifyStrokes(){
  const GAP=6;
  strokes=strokes.map(s=>{
    const pts=s.pts;
    if(pts.length<2) return s;
    const out=[pts[0]];
    for(let i=1;i<pts.length;i++){
      const a=pts[i-1], b=pts[i];
      const d=Math.hypot(b.x-a.x, b.y-a.y);
      const n=Math.max(1, Math.ceil(d/GAP));
      for(let k=1;k<=n;k++)
        out.push(k===n ? b : {x:a.x+(b.x-a.x)*k/n, y:a.y+(b.y-a.y)*k/n,
                              w:a.w+(b.w-a.w)*k/n, t:(a.t||0)+((b.t||0)-(a.t||0))*k/n});
    }
    return {pts:out};
  });
}
/* remove stroke points near eraser segment; returns true if changed */
function applyErase(a,b){
  let changed=false;
  const out=[];
  for(const s of strokes){
    let run=[], removedAny=false;
    const runs=[];
    for(const p of s.pts){
      if(distToSeg(p.x,p.y,a.x,a.y,b.x,b.y)<=eraserR()){
        removedAny=true;
        if(run.length){ runs.push(run); run=[]; }
      }else run.push(p);
    }
    if(run.length) runs.push(run);
    if(!removedAny){ out.push(s); continue; }
    changed=true;
    for(const r of runs){
      if(r.length>1 || s.pts.length===1) out.push({pts:r});
    }
  }
  if(changed) strokes=out;
  return changed;
}

function evPoint(e){
  const r=cv.getBoundingClientRect();
  const pr = e.pressure || 0.5;
  // 画面座標 → ワールド座標。太さは画面基準のまま保存し、塗る側で倍率を吸収する
  const p = toWorld(e.clientX-r.left, e.clientY-r.top);
  return { x:p.x, y:p.y, w:2.6*(0.45+0.9*pr),
           t: performance.now()-roundStart };
}
/* ---- 2本指のピンチで拡大縮小（スマホ・タブレット用）----
   お題も採点もワールド座標のままなので、拡大しても点数は1点も動かない。
   ペンで描いている最中は手のひらでズームしてしまわないよう、
   パームリジェクションを通過したタッチだけを数える。 */
const touchPts=new Map();      // pointerId → 画面座標
let pinch=null;                // {ids,d0,cx0,cy0,s0,x0,y0}
let activeType="";             // いま描いているポインタの種別（手のひら対策で使う）
let spacePanHeld=false;        // Spaceを押している間だけ一時的にパンへ切り替える
let dragPan=null;              // {id,sx,sy,x0,y0}: Space+ドラッグ中の基準
function refreshPanCursor(){
  const ready=spacePanHeld && !dragPan && activeId===null &&
    (state==="draw"||state==="roundResult") && !inputFrozen();
  cv.classList.toggle("pan-ready", ready);
  cv.classList.toggle("panning", !!dragPan);
}
function endDragPan(e){
  if(!dragPan || (e && e.pointerId!==undefined && e.pointerId!==dragPan.id)) return false;
  const id=dragPan.id;
  dragPan=null;
  try{ if(cv.hasPointerCapture(id)) cv.releasePointerCapture(id); }catch(_){}
  refreshPanCursor();
  return true;
}
function abortStroke(){
  const id=activeId;
  if(erasing){ const snap=history.pop(); if(snap) strokes=snap; erasing=false; erasePrev=null; }
  cur=null; activeId=null; activeType=""; captureOk=false;
  try{ if(id!==null && cv.hasPointerCapture(id)) cv.releasePointerCapture(id); }catch(_){}
  rebuildInk(); render();
}
const pinchInfo=()=>{
  const [a,b]=[...touchPts.values()];
  return {d:Math.hypot(b.x-a.x,b.y-a.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2};
};
/* 追跡している指の組が変わったら基準を取り直す。
   3本目を足した／2本のうち片方だけ離した、で倍率が飛ばないようにするため
   （2本でない間はピンチを休止する） */
function syncPinch(){
  if(touchPts.size!==2){ pinch=null; return; }
  const ids=[...touchPts.keys()].sort().join(",");
  if(pinch && pinch.ids===ids) return;
  const g=pinchInfo();
  pinch={ids, d0:Math.max(1,g.d), cx0:g.cx, cy0:g.cy, s0:viewS, x0:viewX, y0:viewY};
}
function activePointerLive(){
  if(activeId===null) return false;
  /* hasPointerCapture を無期限には信用しない。ポインタ消滅時の解放処理が走らない
     WebViewでは lostpointercapture が来ないまま true を返し続け、ペン・指とも
     新規入力が全滅するデッドロックになる（監査指摘）。描いている限り
     lastActiveAt は move のたびに更新されるので、20秒無音のキャプチャは死骸とみなす。 */
  if(captureOk){ try{
    return cv.hasPointerCapture(activeId) && performance.now()-lastActiveAt<20000;
  }catch(_){} }
  return performance.now()-lastActiveAt<900;
}
// ペンで描いている（直後も含む）間は、手のひらをズームにも描画にも使わせない。
// activeTypeだけを信じるとpointerup欠落後に指入力を永久拒否するため、生存確認も行う。
const penBusy = () => (activeType==="pen" && activePointerLive()) || performance.now()-lastPenAt<1500;
function dropTouches(){ if(touchPts.size){ touchPts.clear(); } pinch=null; }
function cancelPointerInteraction(){
  endDragPan();
  dropTouches();
  hoverPos=null;
  abortStroke();
  refreshPanCursor();
}

/* 答え合わせ中もピンチできるようにするため、タッチの追跡だけは
   roundResult でも動かす（描画は従来どおり draw のときだけ） */
function trackTouch(e){
  if(e.pointerType!=="touch") return false;
  if(penBusy()){
    // 手のひらが触れた。進行中のタッチ描画があれば巻き添えを断ち切る
    if(activeType==="touch") abortStroke();
    dropTouches();
    return true;
  }
  /* ★幽霊指の時限削除。pointerupを取りこぼした指が touchPts に残ると、
     以後1本指で触れるたびに「2本目」扱いになり、動かない幽霊点を支点にした
     片手偽ピンチで描けなくなる（監査指摘。isPrimary=false の新指は
     pointerdown側の復旧条件に掛からない）。8秒間moveが来ない指は死骸とみなす。
     本物のピンチ中は両指ともmoveのたびに t が更新されるので誤爆しない。 */
  const nowT=performance.now();
  for(const [id,q] of touchPts){ if(nowT-(q.t||0)>8000) touchPts.delete(id); }
  if(pinch && touchPts.size<2) syncPinch();
  const r=cv.getBoundingClientRect();
  touchPts.set(e.pointerId,{x:e.clientX-r.left, y:e.clientY-r.top, t:nowT});
  if(touchPts.size>=2){
    /* 2本目が触れた＝ズーム操作。直前まで描いていた線を黙って消さず、
       通常のペンアップと同じように確定してから二本指操作へ移る。 */
    if((cur||erasing)&&activeId!==null){
      const id=activeId,type=activeType;
      endStroke({pointerId:id,pointerType:type,preserveTouch:true});
    }
    syncPinch();
    return true;
  }
  return false;
}

cv.addEventListener("pointerdown", e=>{
  /* PC・ペンタブ: Spaceを押しながらドラッグすると一時的に画面移動。
     描画用のactiveIdとは別に持ち、線・消しゴム履歴へ一切混ぜない。 */
  if((state==="draw"||state==="roundResult") && !inputFrozen() &&
     spacePanHeld && e.button===0 && !dragPan && activeId===null){
    dropTouches(); hoverPos=null;
    dragPan={id:e.pointerId, sx:e.clientX, sy:e.clientY, x0:viewX, y0:viewY};
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    refreshPanCursor();
    e.preventDefault();
    return;
  }
  /* 画面外で指を離したとき pointerup / pointercancel / lostpointercapture の
     いずれも届かないWebViewがある。その後の新しいprimary touchは、物理的には
     前のprimary touchがもう存在しないことの確実な証拠。古い線を確定し、残った
     指IDを消してから通常処理へ進める。実際の2本目はisPrimary=falseなので、
     ピンチ操作を誤って復旧扱いにはしない。 */
  if(e.pointerType==="touch" && e.isPrimary && activeType==="touch" && activeId!==null){
    endStroke({pointerId:activeId, pointerType:"touch"});
    dropTouches();
  }
  /* ピンチの片方だけpointerupを取りこぼした場合、Mapに幽霊の指が1本残る。
     新しいprimary touchは「以前の指はもう存在しない」証拠なので追跡を初期化する。 */
  if(e.pointerType==="touch" && e.isPrimary && activeId===null &&
     touchPts.size && !touchPts.has(e.pointerId)) dropTouches();
  // タッチの追跡は答え合わせ中も行う（消失点の図をピンチで見られるように）
  if((state==="draw"||state==="roundResult") && !inputFrozen() && e.pointerType==="touch"){
    if(trackTouch(e)){ e.preventDefault(); return; }
  }
  if(state!=="draw" || inputFrozen()) return;   // ポーズ中・復帰カウントダウン中は描かせない
  if(e.pointerType==="pen"){ lastPenAt=performance.now(); dropTouches(); }
  /* 前のストロークが「終わったことになっていない」場合の復帰。
     画面の端でペンが範囲外に出たり、ウィンドウの外で指を離したりすると
     pointerup が届かず activeId を握ったままになり、そのラウンド中ずっと
     何も描けなくなる（ユーザー報告のバグ）。
     ポインタキャプチャが生きていれば本当に描画中なので従来どおり無視し（手のひら対策）、
     キャプチャが切れていれば取り残しとみなして確定させ、新しいストロークを受け付ける。 */
  if(activeId!==null){
    let live;
    if(captureOk){
      // キャプチャが取れている環境では、それが生きているか＝描画中かの正確な判定になる
      // （ただし20秒無音なら死骸とみなす。activePointerLive と同じ防御）
      live=false;
      try{ live = cv.hasPointerCapture(activeId) && performance.now()-lastActiveAt<20000; }catch(_){}
    }else{
      // キャプチャが使えない環境では時間で見る（手のひらは描いている最中に触れるため）
      live = performance.now()-lastActiveAt < 900;
    }
    if(live) return;
    endStroke({pointerId:activeId, pointerType:activeType});
  }
  activeId=e.pointerId;
  activeType=e.pointerType||"mouse";
  lastActiveAt=performance.now();
  captureOk=false;
  try{ cv.setPointerCapture(e.pointerId); captureOk=true; }catch(_){}
  const p=evPoint(e);
  if(tool==="eraser"){
    pushHistory();
    densifyStrokes();
    erasing=true; eraseChanged=false; erasePrev=p; hoverPos=p; eraseUses++;
    if(applyErase(p,p)){ eraseChanged=true; rebuildInk(); }
    render();
  }else{
    cur={pts:[p]};
  }
  e.preventDefault();
});
window.addEventListener("pointermove", e=>{
  if(inputFrozen()) return;       // ポーズ／3・2・1中は既存ポインタのmoveも描画させない
  if(dragPan && dragPan.id===e.pointerId){
    setView(viewS, dragPan.x0+e.clientX-dragPan.sx, dragPan.y0+e.clientY-dragPan.sy);
    e.preventDefault();
    return;
  }
  /* ペンの「接触中」だけ記録する。ホバーでも更新すると、Apple Pencilを
     浮かせて近づけているだけで指入力が拒否され続けるバグになる（保留していた対策E） */
  if(e.pointerType==="pen" && e.buttons>0) lastPenAt=performance.now();
  // ピンチ中は指の位置を追いかけて表示倍率と位置を更新する（描画はしない）
  if(e.pointerType==="touch" && touchPts.has(e.pointerId)){
    // ペンが動き出したら、追跡中の指（手のひら）は全部捨てる
    if(penBusy()){ dropTouches(); return; }
    const r=cv.getBoundingClientRect();
    touchPts.set(e.pointerId,{x:e.clientX-r.left, y:e.clientY-r.top, t:performance.now()});
    if(pinch && touchPts.size===2){
      const g=pinchInfo();
      const ns=clamp(pinch.s0*(g.d/pinch.d0), VIEW_MIN, VIEW_MAX);
      // つまんだ2本指の中心にあるワールド座標が、指の中心に貼りついたまま動くようにする
      const wx=(pinch.cx0-pinch.x0)/pinch.s0, wy=(pinch.cy0-pinch.y0)/pinch.s0;
      setView(ns, g.cx-wx*ns, g.cy-wy*ns);
      e.preventDefault();
      return;
    }
  }
  // hover indicator for eraser (even when not pressing)
  if(state==="draw" && tool==="eraser" && e.target===cv && activeId===null){
    hoverPos=evPoint(e); render();
  }
  if(activeId!==e.pointerId) return;
  /* 画面外でpointerupを取りこぼしたペン／マウスが、非接触のまま戻ってきた。
     hover座標を線へ追加せず、最後の接触点で安全に確定する。 */
  if((e.pointerType==="pen"||e.pointerType==="mouse") && e.buttons===0){
    endStroke({pointerId:e.pointerId,pointerType:e.pointerType});
    return;
  }
  lastActiveAt=performance.now();
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  if(!evs.length) evs=[e];
  if(erasing){
    let changed=false;
    for(const ev of evs){
      const p=evPoint(ev);
      if(applyErase(erasePrev,p)) changed=true;
      erasePrev=p; hoverPos=p;
    }
    if(changed){ eraseChanged=true; rebuildInk(); }
    render();
  }else if(cur){
    for(const ev of evs){
      const p=evPoint(ev);
      const lp=cur.pts[cur.pts.length-1];
      if(Math.hypot(p.x-lp.x,p.y-lp.y)<1.2) continue;
      cur.pts.push(p);
      drawLiveSegment(cur.pts);
    }
    render();
  }
});
function endStroke(e){
  // 指を離したらピンチの追跡から外す（合成呼び出しには pointerType が無いので素通り）
  if(e.pointerType==="touch" && !e.preserveTouch && touchPts.has(e.pointerId)){
    touchPts.delete(e.pointerId);
    syncPinch();          // 残った指で基準を取り直す（倍率が飛ばない）
  }
  if(activeId!==e.pointerId) return;
  const finishedId=activeId;
  captureOk=false;
  const releaseFinished=()=>{
    try{ if(cv.hasPointerCapture(finishedId)) cv.releasePointerCapture(finishedId); }catch(_){}
  };
  if(erasing){
    erasing=false; erasePrev=null;
    if(!eraseChanged){
      /* densifyStrokesで増やした点も元へ戻す。見た目が同じなのに採点入力だけ
         変わる状態を残さない。 */
      const snap=history.pop(); if(snap) strokes=snap;
      rebuildInk();
    }
    activeId=null; activeType=""; releaseFinished();
    refreshPanCursor();
    return;
  }
  if(!cur){ activeId=null; activeType=""; releaseFinished(); refreshPanCursor(); return; }
  if(state==="draw"){
    finishStrokeInk(cur.pts);
    pushHistory();
    // pushHistory snapshots current strokes (without cur) — then commit
    strokes.push(cur);
    // どの入力デバイスで描いたか（ペン／マウス／指）を点の数で数えておく
    const it=e.pointerType||"mouse";
    inputPts[it]=(inputPts[it]||0)+cur.pts.length;
    maybeShowJudgeHint();
  }
  cur=null; activeId=null; activeType=""; releaseFinished();
  refreshPanCursor();
  render();
}
window.addEventListener("pointerup", e=>{ if(!endDragPan(e)) endStroke(e); });
/* パンなどOSにジェスチャを奪われたときは、その線を「確定」ではなく「破棄」する。
   途切れた線がそのまま採点に混ざるのを防ぐ（保留していた対策F）。
   消しゴム中に奪われた場合は、消しはじめ時点のスナップショットへ巻き戻す */
window.addEventListener("pointercancel", e=>{
  if(endDragPan(e)) return;
  if(e.pointerType==="touch" && touchPts.has(e.pointerId)){
    touchPts.delete(e.pointerId);
    syncPinch();          // 残った指で基準を取り直す（倍率が飛ばない）
  }
  if(activeId!==e.pointerId) return;
  if(erasing){
    const snap=history.pop();
    if(snap) strokes=snap;
    erasing=false; erasePrev=null; activeId=null; activeType=""; captureOk=false;
    rebuildInk(); render();
    return;
  }
  cur=null; activeId=null; activeType=""; captureOk=false;
  rebuildInk(); render();
});
/* ポインタキャプチャを失ったのに pointerup も pointercancel も来なかった場合
   （画面端でペンが範囲外に出た等）は、その時点で描けていた線を確定して解放する。
   pointerup 経由の正常終了では endStroke が先に activeId を消すので二重確定はしない。 */
cv.addEventListener("lostpointercapture", e=>{
  if(endDragPan(e)) return;
  if(activeId!==e.pointerId) return;
  endStroke(e);
});
/* PC・ペンタブはホイールで拡大縮小（カーソルの位置を固定して寄り引きする） */
cv.addEventListener("wheel", e=>{
  if((state!=="draw" && state!=="roundResult") || inputFrozen()) return;
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, viewS*(e.deltaY<0 ? 1.12 : 1/1.12));
}, {passive:false});
cv.addEventListener("pointerout", ()=>{ if(activeId===null){ hoverPos=null; render(); } });
cv.addEventListener("contextmenu", e=>e.preventDefault());

/* ---- 判定ボタン誘導矢印（はじめてさん向け・手動判定5回で卒業） ---- */
const JUDGE_KEY="cube-challenge-judged";
let judgeHintTimer=null;
const judgedTimes=()=>{ try{ return +localStorage.getItem(JUDGE_KEY)||0; }catch(_){ return 0; } };
function maybeShowJudgeHint(){
  const need=Math.min(4, round?round.targets.length:4); // お題が3辺なら3本で出す
  if(state!=="draw" || strokes.length<need || judgedTimes()>=5) return;
  // 制限時間が短い回では、1.3秒後に出る矢印は「出た瞬間に時間切れ」の演出ノイズにしかならない
  if((round.timeLimit||TIME_LIMIT) < 10) return;
  clearTimeout(judgeHintTimer);
  judgeHintTimer=setTimeout(()=>{
    if(state!=="draw" || strokes.length<need) return;
    const h=$("#judgeHint");
    const r=$("#btnSubmit").getBoundingClientRect();
    if(window.innerWidth>=window.innerHeight){
      h.textContent="👉";
      h.className="bobX";
      h.style.left=(r.left-52)+"px";
      h.style.top=(r.top+r.height/2-24)+"px";
    }else{
      h.textContent="👇";
      h.className="bobY";
      h.style.left=(r.left+r.width/2-19)+"px";
      h.style.top=(r.top-52)+"px";
    }
  },1300);
}
function hideJudgeHint(){
  clearTimeout(judgeHintTimer); judgeHintTimer=null;
  $("#judgeHint").className="hidden";
}

/* ================= timer ================= */
let timerId=null, deadline=0, lastTickSec=null, timedOut=false;
let curLimit=TIME_LIMIT;   // このラウンドの制限時間（チャレンジは毎ラウンド変わる）
/* 警告を出しはじめる残り秒数。短いラウンドで警報が長く画面を支配しないよう、
   制限時間に対する割合で決める（30秒→5、13秒→5、9秒→4、8秒→3）。 */
let warnAt=5;
const warnFor = lim => Math.max(2, Math.min(5, Math.round(lim*0.4)));
const ARC_LEN=119.4;
function updateTimerUI(t){
  $("#timerNum").textContent=Math.ceil(t);
  $("#timerArc").setAttribute("stroke-dashoffset", (ARC_LEN*(1-t/curLimit)).toFixed(1));
  const danger=t<=warnAt+0.5;
  $("#timerWrap").classList.toggle("danger",danger);
  $("#timerArc").setAttribute("stroke", danger?"#e14b5a":"#ff8fb7");
}
function startTimer(){
  stopTimer();
  /* 世代を進めて、前ラウンドの復帰カウントダウンがこのラウンドに書き込むのを防ぐ。
     練習ラウンドで早期returnする前に必ず通すこと */
  timerGen++; clearResume(); pausedLeft=null;
  timedOut=false;
  // ガイドなぞりの練習ラウンドと、れんしゅうモードは時間無制限
  if(round.practice || studyRun){ $("#timerWrap").classList.add("hidden"); return; }
  $("#timerWrap").classList.remove("hidden");
  curLimit = round.timeLimit || TIME_LIMIT;
  warnAt = warnFor(curLimit);
  deadline=performance.now()+curLimit*1000;
  lastTickSec=null;
  updateTimerUI(curLimit);
  timerId=setInterval(()=>{
    const t=(deadline-performance.now())/1000;
    if(t<=0){
      stopTimer();
      updateTimerUI(0);
      timedOut=true;
      submit(true);
    }else{
      updateTimerUI(t);
      const s=Math.ceil(t);
      // 最初の1回は軽い予告、そこから先は警告音でせかす
      if(s<=warnAt && s!==lastTickSec){ lastTickSec=s; s>=warnAt ? Sound.tick() : Sound.countdown(s); }
    }
  },100);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
/* 通知・タブ切替・ホーム画面への離脱でタイマーを止める。
   止めないと、戻った瞬間に時間切れ判定が走って「見ていないうちにラウンドを失う」。
   ラン全体が一撃で終わるチャレンジモードでは特に致命的。
   復帰時はすぐ再開せず「3・2・1」を挟んで、画面を認識する時間を返す。

   ⚠ ここは実装で3回踏んだ落とし穴がある。必ず次の3点を守ること:
   ①カウントダウン中(timerId===null)に再び離脱しても止められること
     → 止めないと、裏でカウントダウンが完走して本タイマーが非表示のまま走り出す
   ②カウントダウンは「始まったラウンド」以外に絶対に書き込まないこと（timerGenで判定）
     → 判定→つぎへ が700msの隙間に入ると、次ラウンドの残り時間を前ラウンドの値で上書きし、
       100msタイマーが二重に走る（実測: 13秒のラウンドが0.32秒になって即死した）
   ③カウントダウン中は入力を止めること
     → 止めないと「タブを切り替えるたびに約2秒の時間外描画」ができてしまう */
let pausedLeft=null, resumeTimer=null, timerGen=0;
function clearResume(){
  if(resumeTimer){ clearInterval(resumeTimer); resumeTimer=null; }
  $("#resumeVeil").classList.add("hidden");
}
const inputFrozen = () => pausedLeft!==null;   // ポーズ中・カウントダウン中は描けない
function pauseRoundTimer(){
  if(state!=="draw" || !round) return;
  /* 時間無制限の練習／Studyでも、離脱時には描きかけとポインタ状態を必ず畳む。
     ここをtimerIdの有無より先に行わないと、画面外pointerup後に入力が固着する。 */
  cancelPointerInteraction();
  if(round.practice || studyRun) return;
  // カウントダウン中に再離脱: カウントダウンだけ止めて「止まったまま」を保つ
  // （pausedLeft は残すので、次の復帰で3・2・1をやり直す）
  if(resumeTimer){ clearResume(); return; }
  if(!timerId) return;
  pausedLeft=Math.max(0,(deadline-performance.now())/1000);
  stopTimer();
  clearResume();
}
function resumeRoundTimer(){
  if(pausedLeft===null || state!=="draw" || resumeTimer) return;
  const gen=timerGen;              // このカウントダウンが属するラウンド
  let n=3;
  const veil=$("#resumeVeil"), num=$("#resumeNum");
  veil.classList.remove("hidden");
  const tick=()=>{
    // 別のラウンドに移った／ゲームが終わった場合は、何も書き込まずに消える
    if(gen!==timerGen || state!=="draw"){ clearResume(); pausedLeft=null; return; }
    if(n>0){ num.textContent=n; $("#timerNum").textContent=n; n--; return; }
    clearResume();
    const left=pausedLeft; pausedLeft=null;
    stopTimer();                   // 孤児インターバルを残さない
    deadline=performance.now()+left*1000;
    lastTickSec=null;
    timerId=setInterval(()=>{
      const t=(deadline-performance.now())/1000;
      if(t<=0){ stopTimer(); updateTimerUI(0); timedOut=true; submit(true); }
      else{
        updateTimerUI(t);
        const s=Math.ceil(t);
        if(s<=warnAt && s!==lastTickSec){ lastTickSec=s; s>=warnAt ? Sound.tick() : Sound.countdown(s); }
      }
    },100);
  };
  tick();
  resumeTimer=setInterval(tick,700);
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) pauseRoundTimer(); else resumeRoundTimer();
});
window.addEventListener("pagehide", pauseRoundTimer);
window.addEventListener("pageshow", resumeRoundTimer);

function fixedCameraSpec(distanceM){
  const base=tr(
    `立方体は1辺${CUBE_EDGE_M.toFixed(2)}m（1m³）　CAM: FOV ${CAMERA_FOV_DEG.toFixed(1)}° / f=${CAMERA_FOCAL_NORM.toFixed(3)} / 主点中央 / ROLL 0°`,
    `Cube edges ${CUBE_EDGE_M.toFixed(2)}m (1m³)  CAM: FOV ${CAMERA_FOV_DEG.toFixed(1)}° / f=${CAMERA_FOCAL_NORM.toFixed(3)} / centred principal point / ROLL 0°`);
  const build=` / b${BUILD_ID}`;
  if(!Number.isFinite(distanceM)) return base+build;
  return base+tr(` / 面距離 ${distanceM.toFixed(2)}m`,` / face distance ${distanceM.toFixed(2)}m`)+build;
}

/* どの日にどの変化球を出すかは日付から決定論的に決める（全端末で同じ）。
   ⚠ 散らし方を変えるときは、必ず「全クライアントに行き渡った後の日付」から
   発動させること（古いキャッシュの端末が同じデイリー板に別のお題で登録してしまう） */
const TWIST_START="2026-08-01";
function twistForDailySeed(seed){
  const m=/^daily-(\d{4})-(\d{2})-(\d{2})$/.exec(String(seed||""));
  if(!m) return null;
  const dateStr=m[1]+"-"+m[2]+"-"+m[3];
  if(dateStr < TWIST_START) return null;
  /* 週2回（水曜・土曜）だけ変化球にする（ユーザー決定）。
     曜日はUTC基準で計算するので全端末で同じ。4種を2週間で一巡するローテ */
  const t=Date.UTC(+m[1], +m[2]-1, +m[3]);
  /* 月末スペシャル「りったい十字」(cross) は封印中（2026-07-28 ユーザー判断）。
     主因: ヒント面が立体のどの面なのか判別できず、答えが一意に定まらない。
     ほかに縦キューブの向きの偏り・スマホでの描画範囲の問題も。
     コードは温存してあるので、復活はここに月末判定
     if(new Date(t+86400000).getUTCDate()===1) return "cross"; を戻すだけ */
  const dow=new Date(t).getUTCDay();          // 0=日 … 3=水 … 6=土
  if(dow!==3 && dow!==6) return null;
  /* 「⭕ まんまる」（フリーハンドの正円）は封印した（2026-07-28 ユーザー判断）。
     毎日のリピーターが付いていて離脱を焦る必要がなく、そして円を描くのは
     このゲームの芯＝立方体のパースと関係がない唯一の変化球だったため。
     ★枠は null で残すこと。配列を5個に詰めると割り当てのインデックスが
     ずれて、公開済みクライアント（v1.25＝6個のプール）と同じデイリー板で
     別のお題を出してしまう。null は「変化球なしの普通のデイリー」になる。
     ダブルもフェアネス再設計まで休止したため、その枠だけnullへ置換する。
     配列長と他枠の位置は守り、公開は必ず新キャッシュが行き渡る日境界で行う。 */
  const pool=["ta","dice",null,"notch","wire",null];
  const week=Math.floor(t/(7*86400000));
  return pool[(week*2 + (dow===6?1:0)) % pool.length];
}

/* お手本は実際の出題とは別の固定角度で見せる（答えそのものを見せると写す作業になる） */
function renderTwistExample(cnv, kind){
  const g=cnv.getContext("2d");
  g.clearRect(0,0,cnv.width,cnv.height);
  if(kind==="dbl"){
    // ふたご: 2つの立方体を並べたお手本（共通消失点の例）
    const rotEx={yaw:0.42,pitch:-0.22};
    const shapes=[shapeOf(rotEx,7,-1.8,0), shapeOf(rotEx,7,1.8,0)];
    const all=shapes.reduce((a,s2)=>a.concat(s2.Q),[]);
    const xs=all.map(p=>p.x), ys=all.map(p=>p.y);
    const l=Math.min(...xs),r=Math.max(...xs),t0=Math.min(...ys),b=Math.max(...ys);
    const K=Math.min(cnv.width/(r-l), cnv.height/(b-t0))*0.9;
    const ax=(cnv.width-(r-l)*K)/2 - l*K, ay=(cnv.height-(b-t0)*K)/2 - t0*K;
    g.lineCap="round"; g.lineJoin="round";
    for(const s2 of shapes){
      const P=s2.Q.map(p=>({x:p.x*K+ax, y:p.y*K+ay}));
      const f=CUBE_FACES[s2.shown];
      g.beginPath(); f.idx.forEach((vi,i)=> i?g.lineTo(P[vi].x,P[vi].y):g.moveTo(P[vi].x,P[vi].y));
      g.closePath(); g.fillStyle="rgba(255,143,183,.13)"; g.fill();
      g.strokeStyle="#54455a"; g.lineWidth=2.5;
      for(const e of s2.edges){ if(!e.visible) continue;
        g.beginPath(); g.moveTo(P[e.a].x,P[e.a].y); g.lineTo(P[e.b].x,P[e.b].y); g.stroke(); }
    }
    return;
  }
  if(kind==="maru"){
    // まんまるのお手本: 与えるもの＝直径の直線（濃色）、描くもの＝正円（インク色）
    const cx=cnv.width/2, cy=cnv.height/2, R=Math.min(cnv.width,cnv.height)*0.40;
    const th=-0.5;
    g.lineCap="round"; g.lineJoin="round";
    g.strokeStyle="#5f6fd6"; g.lineWidth=2;
    g.beginPath(); g.arc(cx,cy,R,0,7); g.stroke();
    g.strokeStyle="#54455a"; g.lineWidth=2.5;
    g.beginPath(); g.moveTo(cx+R*Math.cos(th),cy+R*Math.sin(th));
    g.lineTo(cx-R*Math.cos(th),cy-R*Math.sin(th)); g.stroke();
    return;
  }
  if(kind==="cross"){
    // りったい十字のお手本。縦の1個をどちらへ付けるかは本番と同じ式で選ぶ
    const rotEx={yaw:0.55,pitch:-0.30}, Dx=10;
    const nR=mv(rotMat(rotEx.yaw,rotEx.pitch),[0,1,0]);
    const G=(nR[0]*nR[0]+nR[1]*nR[1]+nR[2]*(nR[2]+Dx)<0) ? CROSS_GEOM.up : CROSS_GEOM.down;
    const s2=shapeOf(rotEx,Dx,0,0,G.extra);
    const xs=s2.Q.map(p=>p.x), ys=s2.Q.map(p=>p.y);
    const l=Math.min(...xs),r=Math.max(...xs),t0=Math.min(...ys),b=Math.max(...ys);
    const K=Math.min(cnv.width/(r-l), cnv.height/(b-t0))*0.92;
    const ax=(cnv.width-(r-l)*K)/2 - l*K, ay=(cnv.height-(b-t0)*K)/2 - t0*K;
    const P=s2.Q.map(p=>({x:p.x*K+ax, y:p.y*K+ay}));
    g.lineCap="round"; g.lineJoin="round";
    const cp=crossParts(P, G, rotEx, Dx, 0, 0);
    if(!cp) return;
    g.strokeStyle="rgba(120,100,120,.3)"; g.lineWidth=1.2; g.setLineDash([3,5]);
    for(const h of cp.hidden){
      g.beginPath(); g.moveTo(h.pa.x,h.pa.y); g.lineTo(h.pb.x,h.pb.y); g.stroke();
    }
    g.setLineDash([]);
    g.beginPath(); g.moveTo(cp.hint[0].x,cp.hint[0].y);
    for(let i=1;i<cp.hint.length;i++) g.lineTo(cp.hint[i].x,cp.hint[i].y);
    g.closePath(); g.fillStyle="rgba(255,143,183,.13)"; g.fill();
    g.strokeStyle="#54455a"; g.lineWidth=2.5; g.stroke();
    g.strokeStyle="#5f6fd6"; g.lineWidth=1.8;
    for(const [pa,pb] of cp.targets){
      g.beginPath(); g.moveTo(pa.x,pa.y); g.lineTo(pb.x,pb.y); g.stroke();
    }
    return;
  }
  const rotEx={yaw:0.55,pitch:-0.30};
  const extra = kind==="dice" ? DICE_EXTRA3D
    : kind==="notch" ? NOTCH_EXTRA3D
    : TWIST_EXTRA3D;
  const s=shapeOf(rotEx,5.4,0,0,extra);
  const xs=s.Q.map(p=>p.x), ys=s.Q.map(p=>p.y);
  const l=Math.min(...xs),r=Math.max(...xs),t0=Math.min(...ys),b=Math.max(...ys);
  const K=Math.min(cnv.width/(r-l), cnv.height/(b-t0))*0.82;
  const ax=(cnv.width-(r-l)*K)/2 - l*K, ay=(cnv.height-(b-t0)*K)/2 - t0*K;
  const P=s.Q.map(p=>({x:p.x*K+ax, y:p.y*K+ay}));
  g.lineCap="round"; g.lineJoin="round";
  if(kind==="notch"){
    // ヒント＝Ｌ字の面（塗り）、描くもの＝のこりの辺とへこみ
    const np=notchParts(P, s.vis, s.edges, s.shown);
    if(!np) return;
    g.beginPath(); g.moveTo(np.hint[0].x,np.hint[0].y);
    for(let i=1;i<np.hint.length;i++) g.lineTo(np.hint[i].x,np.hint[i].y);
    g.closePath(); g.fillStyle="rgba(255,143,183,.13)"; g.fill();
    g.strokeStyle="#54455a"; g.lineWidth=2.5; g.stroke();
    g.strokeStyle="#5f6fd6"; g.lineWidth=2;
    for(const [pa,pb] of np.targets){
      g.beginPath(); g.moveTo(pa.x,pa.y); g.lineTo(pb.x,pb.y); g.stroke();
    }
    return;
  }
  if(kind==="wire"){
    // ハリガネ: かくれた辺（描いてもらうもの）をインク色の点線で
    const fw=CUBE_FACES[s.shown];
    g.beginPath(); fw.idx.forEach((vi,i)=> i?g.lineTo(P[vi].x,P[vi].y):g.moveTo(P[vi].x,P[vi].y));
    g.closePath(); g.fillStyle="rgba(255,143,183,.13)"; g.fill();
    g.strokeStyle="#54455a"; g.lineWidth=2.5;
    for(const e of s.edges){ if(!e.visible) continue;
      g.beginPath(); g.moveTo(P[e.a].x,P[e.a].y); g.lineTo(P[e.b].x,P[e.b].y); g.stroke(); }
    g.strokeStyle="#5f6fd6"; g.lineWidth=2; g.setLineDash([6,5]);
    for(const e of s.edges){ if(e.visible) continue;
      g.beginPath(); g.moveTo(P[e.a].x,P[e.a].y); g.lineTo(P[e.b].x,P[e.b].y); g.stroke(); }
    g.setLineDash([]);
    return;
  }
  const f=CUBE_FACES[s.shown];
  g.beginPath(); f.idx.forEach((vi,i)=> i?g.lineTo(P[vi].x,P[vi].y):g.moveTo(P[vi].x,P[vi].y));
  g.closePath(); g.fillStyle="rgba(255,143,183,.13)"; g.fill();
  g.strokeStyle="#54455a"; g.lineWidth=2.5;
  for(const e of s.edges){ if(!e.visible) continue;
    g.beginPath(); g.moveTo(P[e.a].x,P[e.a].y); g.lineTo(P[e.b].x,P[e.b].y); g.stroke(); }
  g.strokeStyle="#5f6fd6"; g.lineWidth=2;   // 描いてもらうものはインク色で
  for(let fi=0;fi<6;fi++){
    if(!s.vis[fi]) continue;
    const ix=CUBE_FACES[fi].idx;
    if(kind==="dice"){
      const base=20+fi*DICE_N;
      g.beginPath(); g.moveTo(P[base].x,P[base].y);
      for(let k=1;k<=DICE_N;k++){ const p=P[base+(k%DICE_N)]; g.lineTo(p.x,p.y); }
      g.stroke();
    }else{
      const M=(a,b2)=>P[8+EDGE_IDX[Math.min(a,b2)+"_"+Math.max(a,b2)]];
      const pairs=[[M(ix[0],ix[1]),M(ix[2],ix[3])],[M(ix[1],ix[2]),M(ix[3],ix[0])]];
      for(const [pa,pb] of pairs){ g.beginPath(); g.moveTo(pa.x,pa.y); g.lineTo(pb.x,pb.y); g.stroke(); }
    }
  }
}
function showTwistIntro(k, onceEver){
  const t=TWISTS[k]; if(!t) return;
  if(onceEver){
    // 変化球セレクト用: その変化球を初めて遊ぶときだけ出す（種類ごとに1回きり）
    const kk="cube-challenge-twist-known-"+k;
    try{ if(localStorage.getItem(kk)==="1") return; localStorage.setItem(kk,"1"); }catch(_){}
  }else{
  const seenKey=gameSeed+"#"+k;   // 同じ日のリトライでは2回出さない
  try{ if(localStorage.getItem("cube-challenge-twist-seen")===seenKey) return; }catch(_){}
  }
  $("#twistTitle").innerHTML=tr("⚡ きょうのデイリーは<br>ひとあじちがう！","⚡ Today's daily has<br>a twist!");
  $("#twistName").textContent=t.name();
  $("#twistDesc").textContent=t.desc();
