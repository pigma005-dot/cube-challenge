/* ================= timer ================= */
let timerId=null, deadline=0, lastTickSec=null, timedOut=false;
let curLimit=TIME_LIMIT;   // このラウンドの制限時間（チャレンジは毎ラウンド変わる）
/* 警告を出しはじめる残り秒数。絶対値5秒のままだと、制限時間そのものが4〜7秒の
   チャレンジ後半で「開始と同時に警報が鳴り、赤く点滅し続ける」状態になるので
   制限時間に対する割合で決める（30秒→5、13秒→5、9秒→4、7秒→3、4秒→2 で従来モードは挙動不変） */
let warnAt=5;
const warnFor = lim => Math.max(2, Math.min(5, Math.round(lim*0.4)));
const ARC_LEN=119.4;
function updateTimerUI(t){
  $("#timerNum").textContent=Math.ceil(t);
  $("#timerArc").setAttribute("stroke-dashoffset", (ARC_LEN*(1-t/curLimit)).toFixed(1));
  const danger=t<=warnAt+0.5;
  $("#timerWrap").classList.toggle("danger",danger);
  $("#timerArc").setAttribute("stroke", danger?"#e14b5a":"#ff8fb7");
}
function startTimer(){
  stopTimer();
  /* 世代を進めて、前ラウンドの復帰カウントダウンがこのラウンドに書き込むのを防ぐ。
     練習ラウンドで早期returnする前に必ず通すこと */
  timerGen++; clearResume(); pausedLeft=null;
  timedOut=false;
  if(round.practice){ $("#timerWrap").classList.add("hidden"); return; }
  $("#timerWrap").classList.remove("hidden");
  curLimit = round.timeLimit || TIME_LIMIT;
  warnAt = warnFor(curLimit);
  deadline=performance.now()+curLimit*1000;
  lastTickSec=null;
  updateTimerUI(curLimit);
  timerId=setInterval(()=>{
    const t=(deadline-performance.now())/1000;
    if(t<=0){
      stopTimer();
      updateTimerUI(0);
      timedOut=true;
      submit(true);
    }else{
      updateTimerUI(t);
      const s=Math.ceil(t);
      // 最初の1回は軽い予告、そこから先は警告音でせかす
      if(s<=warnAt && s!==lastTickSec){ lastTickSec=s; s>=warnAt ? Sound.tick() : Sound.countdown(s); }
    }
  },100);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
/* 通知・タブ切替・ホーム画面への離脱でタイマーを止める。
   止めないと、戻った瞬間に時間切れ判定が走って「見ていないうちにラウンドを失う」。
   ラン全体が一撃で終わるチャレンジモードでは特に致命的。
   復帰時はすぐ再開せず「3・2・1」を挟んで、画面を認識する時間を返す。

   ⚠ ここは実装で3回踏んだ落とし穴がある。必ず次の3点を守ること:
   ①カウントダウン中(timerId===null)に再び離脱しても止められること
     → 止めないと、裏でカウントダウンが完走して本タイマーが非表示のまま走り出す
   ②カウントダウンは「始まったラウンド」以外に絶対に書き込まないこと（timerGenで判定）
     → 判定→つぎへ が700msの隙間に入ると、次ラウンドの残り時間を前ラウンドの値で上書きし、
       100msタイマーが二重に走る（実測: 13秒のラウンドが0.32秒になって即死した）
   ③カウントダウン中は入力を止めること
     → 止めないと「タブを切り替えるたびに約2秒の時間外描画」ができてしまう */
let pausedLeft=null, resumeTimer=null, timerGen=0;
function clearResume(){
  if(resumeTimer){ clearInterval(resumeTimer); resumeTimer=null; }
  $("#resumeVeil").classList.add("hidden");
}
const inputFrozen = () => pausedLeft!==null;   // ポーズ中・カウントダウン中は描けない
function pauseRoundTimer(){
  if(state!=="draw" || !round || round.practice) return;
  // カウントダウン中に再離脱: カウントダウンだけ止めて「止まったまま」を保つ
  // （pausedLeft は残すので、次の復帰で3・2・1をやり直す）
  if(resumeTimer){ clearResume(); return; }
  if(!timerId) return;
  pausedLeft=Math.max(0.5,(deadline-performance.now())/1000);
  stopTimer();
  clearResume();
}
function resumeRoundTimer(){
  if(pausedLeft===null || state!=="draw" || resumeTimer) return;
  const gen=timerGen;              // このカウントダウンが属するラウンド
  let n=3;
  const veil=$("#resumeVeil"), num=$("#resumeNum");
  veil.classList.remove("hidden");
  const tick=()=>{
    // 別のラウンドに移った／ゲームが終わった場合は、何も書き込まずに消える
    if(gen!==timerGen || state!=="draw"){ clearResume(); pausedLeft=null; return; }
    if(n>0){ num.textContent=n; $("#timerNum").textContent=n; n--; return; }
    clearResume();
    const left=pausedLeft; pausedLeft=null;
    stopTimer();                   // 孤児インターバルを残さない
    deadline=performance.now()+left*1000;
    lastTickSec=null;
    timerId=setInterval(()=>{
      const t=(deadline-performance.now())/1000;
      if(t<=0){ stopTimer(); updateTimerUI(0); timedOut=true; submit(true); }
      else{
        updateTimerUI(t);
        const s=Math.ceil(t);
        if(s<=warnAt && s!==lastTickSec){ lastTickSec=s; s>=warnAt ? Sound.tick() : Sound.countdown(s); }
      }
    },100);
  };
  tick();
  resumeTimer=setInterval(tick,700);
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) pauseRoundTimer(); else resumeRoundTimer();
});
window.addEventListener("pagehide", pauseRoundTimer);
window.addEventListener("pageshow", resumeRoundTimer);

   発動させること（古いキャッシュの端末が同じデイリー板に別のお題で登録してしまう） */
const TWIST_START="2026-08-01";
function twistForDailySeed(seed){
  const m=/^daily-(\d{4})-(\d{2})-(\d{2})$/.exec(String(seed||""));
  if(!m) return null;
  const dateStr=m[1]+"-"+m[2]+"-"+m[3];
  if(dateStr < TWIST_START) return null;
  /* 週2回（水曜・土曜）だけ変化球にする（ユーザー決定）。
     曜日はUTC基準で計算するので全端末で同じ。4種を2週間で一巡するローテ */
  const t=Date.UTC(+m[1], +m[2]-1, +m[3]);
  /* 月末スペシャル「りったい十字」(cross) は封印中（2026-07-28 ユーザー判断）。
     主因: ヒント面が立体のどの面なのか判別できず、答えが一意に定まらない。
     ほかに縦キューブの向きの偏り・スマホでの描画範囲の問題も。
     コードは温存してあるので、復活はここに月末判定
     if(new Date(t+86400000).getUTCDate()===1) return "cross"; を戻すだけ */
  const dow=new Date(t).getUTCDay();          // 0=日 … 3=水 … 6=土
  if(dow!==3 && dow!==6) return null;
  const pool=["ta","dice","dbl","notch","wire","maru"];
  const week=Math.floor(t/(7*86400000));
  return pool[(week*2 + (dow===6?1:0)) % pool.length];
}

/* お手本は実際の出題とは別の固定角度で見せる（答えそのものを見せると写す作業になる） */
function renderTwistExample(cnv, kind){
  const g=cnv.getContext("2d");
  g.clearRect(0,0,cnv.width,cnv.height);
  if(kind==="dbl"){
    // ふたご: 2つの立方体を並べたお手本（共通消失点の例）
    const rotEx={yaw:0.42,pitch:-0.22};
    const shapes=[shapeOf(rotEx,7,-1.8,0), shapeOf(rotEx,7,1.8,0)];
    const all=shapes.reduce((a,s2)=>a.concat(s2.Q),[]);
    const xs=all.map(p=>p.x), ys=all.map(p=>p.y);
    const l=Math.min(...xs),r=Math.max(...xs),t0=Math.min(...ys),b=Math.max(...ys);
    const K=Math.min(cnv.width/(r-l), cnv.height/(b-t0))*0.9;
    const ax=(cnv.width-(r-l)*K)/2 - l*K, ay=(cnv.height-(b-t0)*K)/2 - t0*K;
    g.lineCap="round"; g.lineJoin="round";
    for(const s2 of shapes){
      const P=s2.Q.map(p=>({x:p.x*K+ax, y:p.y*K+ay}));
      const f=CUBE_FACES[s2.shown];
      g.beginPath(); f.idx.forEach((vi,i)=> i?g.lineTo(P[vi].x,P[vi].y):g.moveTo(P[vi].x,P[vi].y));
      g.closePath(); g.fillStyle="rgba(255,143,183,.13)"; g.fill();
      g.strokeStyle="#54455a"; g.lineWidth=2.5;
      for(const e of s2.edges){ if(!e.visible) continue;
        g.beginPath(); g.moveTo(P[e.a].x,P[e.a].y); g.lineTo(P[e.b].x,P[e.b].y); g.stroke(); }
    }
    return;
  }
  if(kind==="maru"){
    // まんまるのお手本: 与えるもの＝直径の直線（濃色）、描くもの＝正円（インク色）
    const cx=cnv.width/2, cy=cnv.height/2, R=Math.min(cnv.width,cnv.height)*0.40;
    const th=-0.5;
    g.lineCap="round"; g.lineJoin="round";
    g.strokeStyle="#5f6fd6"; g.lineWidth=2;
    g.beginPath(); g.arc(cx,cy,R,0,7); g.stroke();
    g.strokeStyle="#54455a"; g.lineWidth=2.5;
    g.beginPath(); g.moveTo(cx+R*Math.cos(th),cy+R*Math.sin(th));
    g.lineTo(cx-R*Math.cos(th),cy-R*Math.sin(th)); g.stroke();
    return;
  }
  if(kind==="cross"){
    // りったい十字のお手本。縦の1個をどちらへ付けるかは本番と同じ式で選ぶ
    const rotEx={yaw:0.55,pitch:-0.30}, Dx=10;
    const nR=mv(rotMat(rotEx.yaw,rotEx.pitch),[0,1,0]);
    const G=(nR[0]*nR[0]+nR[1]*nR[1]+nR[2]*(nR[2]+Dx)<0) ? CROSS_GEOM.up : CROSS_GEOM.down;
    const s2=shapeOf(rotEx,Dx,0,0,G.extra);
    const xs=s2.Q.map(p=>p.x), ys=s2.Q.map(p=>p.y);
    const l=Math.min(...xs),r=Math.max(...xs),t0=Math.min(...ys),b=Math.max(...ys);
    const K=Math.min(cnv.width/(r-l), cnv.height/(b-t0))*0.92;
    const ax=(cnv.width-(r-l)*K)/2 - l*K, ay=(cnv.height-(b-t0)*K)/2 - t0*K;
    const P=s2.Q.map(p=>({x:p.x*K+ax, y:p.y*K+ay}));
    g.lineCap="round"; g.lineJoin="round";
    const cp=crossParts(P, G, rotEx, Dx, 0, 0);
    if(!cp) return;
    g.strokeStyle="rgba(120,100,120,.3)"; g.lineWidth=1.2; g.setLineDash([3,5]);
    for(const h of cp.hidden){
      g.beginPath(); g.moveTo(h.pa.x,h.pa.y); g.lineTo(h.pb.x,h.pb.y); g.stroke();
    }
    g.setLineDash([]);
    g.beginPath(); g.moveTo(cp.hint[0].x,cp.hint[0].y);
    for(let i=1;i<cp.hint.length;i++) g.lineTo(cp.hint[i].x,cp.hint[i].y);
    g.closePath(); g.fillStyle="rgba(255,143,183,.13)"; g.fill();
    g.strokeStyle="#54455a"; g.lineWidth=2.5; g.stroke();
    g.strokeStyle="#5f6fd6"; g.lineWidth=1.8;
    for(const [pa,pb] of cp.targets){
      g.beginPath(); g.moveTo(pa.x,pa.y); g.lineTo(pb.x,pb.y); g.stroke();
    }
    return;
  }
  const rotEx={yaw:0.55,pitch:-0.30};
  const extra = kind==="dice" ? DICE_EXTRA3D
    : kind==="notch" ? NOTCH_EXTRA3D
    : TWIST_EXTRA3D;
  const s=shapeOf(rotEx,5.4,0,0,extra);
  const xs=s.Q.map(p=>p.x), ys=s.Q.map(p=>p.y);
  const l=Math.min(...xs),r=Math.max(...xs),t0=Math.min(...ys),b=Math.max(...ys);
  const K=Math.min(cnv.width/(r-l), cnv.height/(b-t0))*0.82;
  const ax=(cnv.width-(r-l)*K)/2 - l*K, ay=(cnv.height-(b-t0)*K)/2 - t0*K;
  const P=s.Q.map(p=>({x:p.x*K+ax, y:p.y*K+ay}));
  g.lineCap="round"; g.lineJoin="round";
  if(kind==="notch"){
    // ヒント＝Ｌ字の面（塗り）、描くもの＝のこりの辺とへこみ
    const np=notchParts(P, s.vis, s.edges, s.shown);
    if(!np) return;
    g.beginPath(); g.moveTo(np.hint[0].x,np.hint[0].y);
    for(let i=1;i<np.hint.length;i++) g.lineTo(np.hint[i].x,np.hint[i].y);
    g.closePath(); g.fillStyle="rgba(255,143,183,.13)"; g.fill();
    g.strokeStyle="#54455a"; g.lineWidth=2.5; g.stroke();
    g.strokeStyle="#5f6fd6"; g.lineWidth=2;
    for(const [pa,pb] of np.targets){
      g.beginPath(); g.moveTo(pa.x,pa.y); g.lineTo(pb.x,pb.y); g.stroke();
    }
    return;
  }
  if(kind==="wire"){
    // ハリガネ: かくれた辺（描いてもらうもの）をインク色の点線で
    const fw=CUBE_FACES[s.shown];
    g.beginPath(); fw.idx.forEach((vi,i)=> i?g.lineTo(P[vi].x,P[vi].y):g.moveTo(P[vi].x,P[vi].y));
    g.closePath(); g.fillStyle="rgba(255,143,183,.13)"; g.fill();
    g.strokeStyle="#54455a"; g.lineWidth=2.5;
    for(const e of s.edges){ if(!e.visible) continue;
      g.beginPath(); g.moveTo(P[e.a].x,P[e.a].y); g.lineTo(P[e.b].x,P[e.b].y); g.stroke(); }
    g.strokeStyle="#5f6fd6"; g.lineWidth=2; g.setLineDash([6,5]);
    for(const e of s.edges){ if(e.visible) continue;
      g.beginPath(); g.moveTo(P[e.a].x,P[e.a].y); g.lineTo(P[e.b].x,P[e.b].y); g.stroke(); }
    g.setLineDash([]);
    return;
  }
  const f=CUBE_FACES[s.shown];
  g.beginPath(); f.idx.forEach((vi,i)=> i?g.lineTo(P[vi].x,P[vi].y):g.moveTo(P[vi].x,P[vi].y));
  g.closePath(); g.fillStyle="rgba(255,143,183,.13)"; g.fill();
  g.strokeStyle="#54455a"; g.lineWidth=2.5;
  for(const e of s.edges){ if(!e.visible) continue;
    g.beginPath(); g.moveTo(P[e.a].x,P[e.a].y); g.lineTo(P[e.b].x,P[e.b].y); g.stroke(); }
  g.strokeStyle="#5f6fd6"; g.lineWidth=2;   // 描いてもらうものはインク色で
  for(let fi=0;fi<6;fi++){
    if(!s.vis[fi]) continue;
    const ix=CUBE_FACES[fi].idx;
    if(kind==="dice"){
      const base=20+fi*DICE_N;
      g.beginPath(); g.moveTo(P[base].x,P[base].y);
      for(let k=1;k<=DICE_N;k++){ const p=P[base+(k%DICE_N)]; g.lineTo(p.x,p.y); }
      g.stroke();
    }else{
      const M=(a,b2)=>P[8+EDGE_IDX[Math.min(a,b2)+"_"+Math.max(a,b2)]];
      const pairs=[[M(ix[0],ix[1]),M(ix[2],ix[3])],[M(ix[1],ix[2]),M(ix[3],ix[0])]];
      for(const [pa,pb] of pairs){ g.beginPath(); g.moveTo(pa.x,pa.y); g.lineTo(pb.x,pb.y); g.stroke(); }
    }
  }
}
function showTwistIntro(k, onceEver){
  const t=TWISTS[k]; if(!t) return;
  if(onceEver){
    // 変化球セレクト用: その変化球を初めて遊ぶときだけ出す（種類ごとに1回きり）
    const kk="cube-challenge-twist-known-"+k;
    try{ if(localStorage.getItem(kk)==="1") return; localStorage.setItem(kk,"1"); }catch(_){}
  }else{
  const seenKey=gameSeed+"#"+k;   // 同じ日のリトライでは2回出さない
  try{ if(localStorage.getItem("cube-challenge-twist-seen")===seenKey) return; }catch(_){}
  }
  $("#twistTitle").innerHTML=tr("⚡ きょうのデイリーは<br>ひとあじちがう！","⚡ Today's daily has<br>a twist!");
  $("#twistName").textContent=t.name();
  $("#twistDesc").textContent=t.desc();
  $("#btnTwistGo").textContent=tr("✨ わかった！","✨ Got it!");

}

function startGame(m, opts){
  opts=opts||{};
  mode=m; roundIdx=0; scores=[]; roundsInfo=[]; encouraged=false; noteOnce=new Set(); inputPts={};
  /* チャレンジ＝エンドレス・サバイバル。練習ラウンドは置かない
     （練習はタイマー自体が出ないので、ラダー先頭が「無制限の練習」に食われる） */
  endlessRun = (m==="endless");
  totalRounds  = endlessRun ? Infinity : TOTAL_ROUNDS;
  practiceRounds = endlessRun ? 0 : PRACTICE_ROUNDS;
  endDead=false; endDeadReason="";
  gameSeed = opts.seed || randomSeed();
  seededRun = !!opts.seed;
  // 変化球はシードの日付から決まる（デイリー本番も、共有された?seed=での再挑戦も同じお題になる）。
  // opts.twist は変化球セレクト（かくしメニュー）からの指名。この回は記録対象外にする。
  // チャレンジは純粋な腕試しなので変化球を混ぜない（?seed=で日付を渡されても無効）
  gameTwist = endlessRun ? null
    : (TWISTS[opts.twist] && opts.twist) || twistForDailySeed(gameSeed) || null;
  twistSelRun = !!(TWISTS[opts.twist] && opts.twist) && !endlessRun;
  isDaily = !!opts.daily;
  dailyDate = isDaily ? (opts.seed||todaySeedStr()) : "";
  $("#menuOverlay").classList.add("hidden");
  $("#finalOverlay").classList.add("hidden");
  $("#modePopup").classList.add("hidden");
  // ポップアップが開いたまま次のゲームが始まると、キャンバスの上に残って操作を塞ぐ
  stopReplay();
  $("#shotPopup").classList.add("hidden");
  $("#sharePopup").classList.add("hidden");
  $("#twistIntro").classList.add("hidden");
  Sound.start();
  newRound();
  // お題見せ画面。ラウンド1は練習（タイマーなし）なので上に被せても安全。
  // セレクトの回は「その変化球を初めて遊ぶとき」だけ出す（毎回出るとうっとおしい）
  if(gameTwist) showTwistIntro(gameTwist, twistSelRun);
}

/* 「前半は真面目に描いていたのに急に投げやりになった人」を見つける。
   下手な人を巻き込まないよう、点数ではなく“手数と時間”で判定する。
   （難しい回を粘って時間切れになった人は対象にしない） */
function gaveUpNow(res, elapsedSec, auto){
  // チャレンジは「速く判定する」のが正しい遊び方なので、投げやり判定（12秒以内＝あきらめ）は使わない
  if(encouraged || round.practice || endlessRun) return false;
  const R=roundsInfo.filter(r=>!r.practice);
  // もともとちゃんと描いていた回が2回以上あることが前提
  if(R.filter(r=>r.strokeCount>=3 && r.score>=45).length<2) return false;
  const needed=Math.max(1, round.targets.length);
  const tooFewLines = strokes.length <= Math.max(1, Math.floor(needed/2));
  if(!(tooFewLines && res.cov<0.35)) return false;
  const bailedFast = !auto && elapsedSec<=12;      // 早々に判定を押して投げた
  const satOut     = auto && strokes.length<=1;    // ほぼ描かずに時間切れ
  return bailedFast || satOut;
}

/* ラウンドの一言。上から優先で最大3つ。数値から言えることだけを言う。 */
function roundNotes(res, auto, oneStroke, giveUp){
  const n=[];
  const push=s=>{ if(s && n.length<3 && !n.includes(s)) n.push(s); };
  // 1ランに1回しか出さない一言（抽象的でくり返すとうるさいもの）
  const pushOnce=(key,s)=>{ if(noteOnce.has(key)||n.length>=3) return; noteOnce.add(key); push(s); };
  /* 同じ判定でも言い回しを変える。roundIdx基準なので同じシードなら同じ順に出る。
     くり返しのうっとおしさはここで吸収する */
  const v=arr=>arr[roundIdx % arr.length];
  /* 静かな回。本番の半分は「特異なことをした回」以外なにも出さない。
     ずっと喋られると重いので、褒め・診断・埋め言葉はここで止める。
     どちらの回が静かになるかはシードで決まる（同じお題なら同じ挙動） */
  let sh=0; for(let i=0;i<gameSeed.length;i++) sh=(sh*31+gameSeed.charCodeAt(i))|0;
  const quiet = !round.practice && ((roundIdx + (sh>>>0)) % 2 === 0);
  const pushLoud=s=>{ if(!quiet) push(s); };
  const R=roundsInfo.filter(r=>!r.practice);       // まだ今回はpushされていない＝前回まで
  const prev=R.length?R[R.length-1]:null;
  /* 時間切れは「合否」ではなく事実の通知。描けていた分で合格ラインを超えていれば生き残る */
  if(auto) push(v([tr("⏰ じかんぎれ！","⏰ Time's up!"),
                   tr("⏰ タイムアップ！","⏰ Out of time!"),
                   tr("⏰ ここまで！","⏰ Pens down!")]));
  /* ランが終わった回は、理由をはっきり出す（説明なく終わると「壊れた」と読まれる） */
  if(endlessRun && endDead){
    push(endDeadReason==="cap"
      ? tr("👑 ここまで来たらもう完璧だよ","👑 That's as far as it goes — flawless")
      : tr(`😵 ごうかくライン ${endPass(roundIdx)}点にとどかず`,
           `😵 Below the ${endPass(roundIdx)}-point pass line`));
  }
  if(round.practice) push(v([tr("🌱 れんしゅう（採点対象外）","🌱 Practice (not scored)"),
                             tr("🌱 れんしゅう中。点はつかないよ","🌱 Practice — no score here")]));
  if(giveUp) push(tr("🍀 あきらめないで！1本からでいいよ","🍀 Don't give up — one edge is enough!"));
  if(res.gridish) push(res.gridish==="dots"
    ? tr("🌅 みごとな点描！でも点数は線からしか出ないよ","🌅 Fine pointillism! But only lines can score")
    : tr("🕸️ グリッドでは点がでないよ。辺をなぞろう","🕸️ Grids don't score — trace the edges"));
  if(res.doodle) push(doodleNote(res.doodle, roundIdx));
  else if(res.mirrored) push(v([tr("🪞 左右がぎゃくさまだよ！","🪞 That's the mirror image!"),
                                tr("🪞 鏡にうつってる！","🪞 You drew it flipped!")]));
  if(oneStroke) push(v([tr("✒️ 一筆書き！","✒️ One stroke!"),
                        tr("✒️ ペンを離さずに！","✒️ Never lifted the pen!")]));
  // キーボードショートカットに気づいて使っている人をほめる（1ランに1回）
  if(undoKeyUses>0) pushOnce("undokey", tr("⌨️ Ctrl+Z つかえてる！","⌨️ Nice — Ctrl+Z!"));
  /* 何を直せば伸びるかの診断。「描き落とし」と「位置ずれ」は
     引いた線の総長で見分ける（本数だと一筆書きの人を誤診する）。
     グリッド／点描の回は🕸️🌅の一言が原因を言っているので診断は出さない */
  if(!res.doodle && !res.gridish){
    const needLen=round.targets.reduce((a,t)=>a+(t.len||Math.hypot(t.pb.x-t.pa.x,t.pb.y-t.pa.y)),0);
    let drawnLen=0;
    for(const s of strokes){ const p=s.pts;
      for(let i=1;i<p.length;i++) drawnLen+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y); }
    const drewEnough = needLen>0 && drawnLen>=needLen*0.7;
    if(res.cov<0.60 && !drewEnough)     pushLoud(round.twist==="maru"
      ? tr("🧩 円がとぎれているよ。さいごまでつなげよう","🧩 The circle has gaps — close the loop")
      : v([tr("🧩 かけていない辺があるよ","🧩 Some edges are still missing"),
           tr("🧩 まだ描いてない辺がある","🧩 There are edges left undrawn"),
           tr("🧩 辺が足りてないかも","🧩 Looks like a few edges short")]));
    // 「位置がずれてる」は抽象的なので、気づかせる1回だけにする
    else if(res.cov<0.75 && drewEnough && !quiet) pushOnce("offset", tr("📏 ぜんぶ描けてる！あとは位置","📏 All there — just off position"));
    else if(res.eff<0.95)               pushLoud(v([tr("✏️ 辺からはずれた線が多いです","✏️ Too many lines off the edges"),
                                                 tr("✏️ よけいな線がおおいかも","✏️ A lot of stray lines"),
                                                 tr("✏️ 線をへらすと伸びるよ","✏️ Fewer lines would score better")]));
  }
  // 伸びをほめる（本番だけ）
  if(!round.practice){
    if(prev){
      const d=res.score-prev.score;
      if(d>=8) pushLoud(tr(`📈 まえより +${d.toFixed(2)}点！`,`📈 +${d.toFixed(2)} vs last round!`));
    }
    /* Sの連続は「回数」を出す。同じ文をくり返すとうるさいので、
       毎回ちがう情報になるようにして3連続からにする */
    if(gradeOf(res.score)==="S"){
      let st=1;
      for(let i=R.length-1;i>=0;i--){ if(gradeOf(R[i].score)==="S") st++; else break; }
      if(st>=3) pushLoud(tr(`🔥 S ${st}れんぞく！`,`🔥 ${st} S grades in a row!`));
    }
    if(R.length>=2 && res.score>Math.max(...R.map(r=>r.score)))
      pushLoud(v([tr("🌟 いまのがベストラウンド！","🌟 Your best round yet!"),
              tr("🌟 このランで一番！","🌟 Best of this run!"),
              tr("🌟 自己最高の回","🌟 A personal best round")]));
  }
  // 出題のたね明かし
  if(round.twist==="ta") pushOnce("twistTa",
    tr("⊞ 面の中心は対角線でとれるよ","⊞ Diagonals find the centre of a face"));
  if(round.twist==="dice") pushOnce("twistDice",
    tr("⚀ 目の丸は、面のかたむきと同じだけつぶれるよ","⚀ Pips squash exactly as much as their face does"));
  if(round.twist==="notch") pushOnce("twistNotch",
    tr("🍫 かじり口は、よつわりの十字で作図できるよ","🍫 The bite lines up with the quartering cross"));
  if(round.twist==="cross") pushOnce("twistCross",
    tr("➕ ゴースト箱を6こ組んでから折り目をなぞると速いよ","➕ Rough in six ghost boxes, then trace the creases"));
  if(round.mode==="wire") pushOnce("twistWire",
    tr("🩻 かくれた辺も、おなじ消失点にあつまるよ","🩻 Hidden edges meet the same vanishing points"));
  if(round.twist==="maru") pushOnce("twistMaru",
    tr("⭕ 外に接する正方形を作図すると、まるが安定するよ","⭕ A circumscribed square keeps your circle honest"));
  if(round.mode==="double") push(tr(`消失点は「${round.shared?"共通":"別々"}」でした！`,`Vanishing points were ${round.shared?"shared":"different"}!`));
  if(Math.abs(round.cubes[0].rot.pitch)>=45*DEG)
    push(v([tr("⛰️ アオリ／フカンの回でした","⛰️ That was a worm's/bird's-eye one"),
            tr("⛰️ 上下のパースが強い回","⛰️ Strong vertical perspective"),
            tr("⛰️ むずかしい角度の回でした","⛰️ A tricky angle, that one")]));
  /* 何も該当しなかった「静かでない回」だけ、グレード別の一言で埋める。
     静かな回はここも通さないので、本当に無言のラウンドができる */
  if(!n.length && !round.practice && !quiet){
    const vv={
      S:[tr("✨ ほぼぴったり！","✨ Almost exact!"), tr("✨ ずれが見えない","✨ Can't see the gap"), tr("✨ みごと","✨ Beautiful")],
      A:[tr("👏 いいかんじ！","👏 Nicely done!"), tr("👏 かなり近い","👏 Very close"), tr("👏 つかめてる","👏 You've got it")],
      B:[tr("🧊 かたちになってきた","🧊 It's taking shape"), tr("🧊 立方体に見える","🧊 Reads as a cube"), tr("🧊 あと一歩","🧊 One step away")],
      C:[tr("🌱 つぎはもうすこし","🌱 A little closer next time"), tr("🌱 おしい","🌱 So close"), tr("🌱 かたちは見えてる","🌱 The shape is there")],
      D:[tr("🌱 ゆっくりでいいよ","🌱 Take your time"), tr("🌱 つぎの1回で","🌱 Next one's yours"),
         endlessRun ? tr("🌱 つぎで取りかえそう","🌱 Win it back next round")
                      : tr("🌱 まだ6回ある","🌱 Plenty of rounds left")],
    }[gradeOf(res.score)];
    push(vv[roundIdx % vv.length]);
  }
  return n;
}

function submit(auto){
  if(state!=="draw") return;
  if(!auto && inputFrozen()) return;   // 復帰カウントダウン中の判定は受け付けない
  // 縦画面では「つぎへ」と「はんてい！」がほぼ同じ位置に出るため、
  // ラウンド開始直後の誤タップ（ダブルタップの2打目）で0点にならないよう無視する
  if(!auto && performance.now()-roundStart < 450) return;
  stopTimer();
  hideJudgeHint();
  if(!auto){ try{ localStorage.setItem(JUDGE_KEY, judgedTimes()+1); }catch(_){} }
  if(cur){ // stroke still in progress at time-up: commit it
    finishStrokeInk(cur.pts); pushHistory(); strokes.push(cur); cur=null; activeId=null;
  }
  erasing=false;
  const res = scoreRound(round, strokes);
  // ペンを一度も離さずに描き切った人（かくし称号「一筆書きの達人」）
  const oneStroke = strokes.length===1 && res.score>=60;
  round.result=res;
  /* チャレンジの生死判定はここ1箇所だけで決める（submitとnextの二重発火を避ける）。
     表示は2桁に丸めた値なので、判定も丸めた値で行う——「30.00点なのに死んだ」を防ぐ */
  /* 時間切れそのものは不合格にしない（ユーザー判断）。
     ブザーが鳴る前に描けていた分はちゃんと採点され、合格ラインを超えていれば生き残る。
     ＝時間の短さは「点が伸びない」という形で効き、二重の罰にはしない。
     終了は「合格ラインを下回った」ときだけ。ラインはR27で101点＝満点でも不可能になるので
     必ず終わる（時間切れ判定に頼らなくても有界であることは変わらない） */
  if(endlessRun && !endDead){
    const shown=+res.score.toFixed(2);
    if(shown<endPass(roundIdx)){ endDead=true; endDeadReason="score"; }
    else if(roundIdx>=END_MAX-1){ endDead=true; endDeadReason="cap"; }
  }
  scores.push(round.practice ? null : res.score);
  setState("roundResult");
  resultAt=performance.now();
  const g=gradeOf(res.score);
  $("#rpScore").innerHTML = `${res.score.toFixed(2)}<small>${tr("点","pts")}</small>`;
  const sc=$("#rpScore"); sc.style.animation="none"; void sc.offsetWidth; sc.style.animation="";
  $("#rpGrade").textContent=g;
  $("#rpGrade").style.background=gradeColor(g);
  const giveUp = gaveUpNow(res, (performance.now()-roundStart)/1000, auto);
  if(giveUp) encouraged=true;            // 1ラン1回だけ。しつこく言わない
  $("#rpNote").textContent = roundNotes(res, auto, oneStroke, giveUp).join("　");
  $("#btnNext").textContent = (endlessRun ? endDead : roundIdx===totalRounds-1)
    ? tr("🏁 けっかをみる","🏁 See results") : tr("➡️ つぎへ","➡️ Next");
  if(auto) Sound.timeup(); else Sound.score(g);
  // 答え合わせスナップショット（最終画面グリッド＆シェア用）と
  // インクなしベース画像（リプレイ用）を撮っておく
  drawScene();
  let shot=null, baseShot=null, shotScale=1;
  try{
    const k=Math.min(1, 1000/cv.width);
    const cw=Math.round(cv.width*k), ch=Math.round(cv.height*k);
    shotScale=cw/W;
    const snap=()=>{
      const c2=document.createElement("canvas");
      c2.width=cw; c2.height=ch;
      c2.getContext("2d").drawImage(cv,0,0,cw,ch);
      return c2.toDataURL("image/jpeg",0.85);
    };
    shot=snap();
    hideInk=true; drawScene(); baseShot=snap();
    hideInk=false; drawScene();
  }catch(_){ hideInk=false; }
  roundsInfo.push({
    shot, baseShot, shotScale,
    strokes: strokes.map(s=>({pts:s.pts.map(p=>({x:p.x,y:p.y,w:p.w,t:p.t||0}))})),
    score:res.score, practice:round.practice, timedOut:!!auto, doodle:res.doodle||null,
    oneStroke, mirrored:!!res.mirrored, gridish:res.gridish||null,
    farInk:res.farInk||0, erased:eraseUses, strokeCount:strokes.length,
    undoKey:undoKeyUses, undoBtn:undoBtnUses, cleared:clearUses,
    // アオリ／フカンの回か、最初の線を引くまでに何秒かけたか（バッジの判定用）
    tilted: Math.abs(round.cubes[0].rot.pitch)>=45*DEG,
    firstAt: strokes.length ? (strokes[0].pts[0].t||0)/1000 : null,
    // 残り時間（本番のみ）とそのラウンドの制限時間。早撃ち／ギリギリ職人の判定に使う
    secLeft: round.practice ? null : Math.max(0,(deadline-performance.now())/1000),
    limit: round.timeLimit || TIME_LIMIT,
  });
  /* エンドレスでは roundsInfo が際限なく膨らむ（1ラウンドあたりJPEG2枚＋全ストローク座標）。
     長く生き延びた人ほどメモリで落ちるのは本末転倒なので、
     古い回の重いデータだけ捨てる（点数などの集計用フィールドは残す） */
  if(endlessRun && roundsInfo.length>END_KEEP_SHOTS){
    const drop=roundsInfo[roundsInfo.length-1-END_KEEP_SHOTS];
    if(drop){ drop.shot=null; drop.baseShot=null; drop.strokes=[]; }
  }
  if(!round.practice && g==="S") fx.burst(70);
  render();
}

function next(){
  if(state!=="roundResult") return;
  // 「はんてい！」の誤ダブルタップで答え合わせを飛ばさないようにする
  if(performance.now()-resultAt < 450) return;
  // チャレンジは死んだ時だけ終わる（ラウンド数の上限はない）
  if(endlessRun){
    if(endDead){ showFinal(); return; }
    roundIdx++; newRound(); return;
  }
  roundIdx++;
  if(roundIdx>=totalRounds){ showFinal(); } else { newRound(); }
}

function showFinal(){
  setState("final");
  const scored=scores.filter(s=>s!==null);
  // 1ラウンドも採点されずに終わっても NaN にしない（チャレンジは初回で死にうる）
  const avg = scored.length
    ? Math.round(scored.reduce((a,b)=>a+b,0)/scored.length*100)/100 : 0;
  /* チャレンジの成績は「平均点」ではなく「生き延びたラウンド数」。
     死んだラウンドは越えられていないので数に入れない。
     同点崩し用に、生き延びた回だけの平均点も出しておく（早く死んだ人が
     平均で有利にならないよう、順位は必ずラウンド数が優先される） */
  const survived = endlessRun
    ? (endDeadReason==="cap" ? scored.length : Math.max(0, scored.length-1)) : 0;
  const aliveArr = endlessRun ? scored.slice(0,survived) : [];
  const avgAlive = aliveArr.length
    ? Math.round(aliveArr.reduce((a,b)=>a+b,0)/aliveArr.length*100)/100 : 0;
  const g=gradeOf(endlessRun ? avgAlive : avg);
  $("#finalMode").textContent = twistSelRun && TWISTS[gameTwist]
    ? tr("変化球セレクト・","Twist Select · ")+TWISTS[gameTwist].name()
    : MODES[mode].name + (isDaily?tr("・きょうのチャレンジ"," · Daily Challenge"):"");
  if(endlessRun){
    $("#finalScore").innerHTML=`${survived}<small>${tr("ラウンド","rounds")}</small>`;
    $("#finalGrade").textContent=g;
    $("#finalGrade").style.background=gradeColor(g);
  }else{
    $("#finalScore").innerHTML=`${avg.toFixed(2)}<small>${tr("点","pts")}</small>`;
    $("#finalGrade").textContent=g;
    $("#finalGrade").style.background=gradeColor(g);
  }
  const grid=$("#finalGrid"); grid.innerHTML="";
  // エンドレスでは画像を捨てた古い回があるので、残っている回だけ並べる
  roundsInfo.forEach((info,i)=>{
    if(endlessRun && !info.shot) return;
    const cell=document.createElement("div");
    cell.className="shotCell"+(info.practice?" practice":"");
    const im=document.createElement("img");
    if(info.shot) im.src=info.shot;
    im.alt=`ラウンド${i+1}`;
    const lab=document.createElement("div");
    lab.className="shotLab";
    lab.textContent = info.practice ? `R${i+1} 🌱` : `R${i+1}　${info.score.toFixed(2)}`;
    cell.append(im,lab);
    cell.addEventListener("click",()=>openShot(i));
    grid.appendChild(cell);
  });
  const best=loadBest();
  let isBest=false;
  $("#btnRetry").style.opacity=1;   // デイリーで薄くした状態を持ち越さない
  if(isDaily){
    const rec=dailyRec(dailyDate);   // 開始時の日付で読む（日付またぎで記録を壊さない）
    const left=Math.max(0, DAILY_MAX-rec.tries);
    const leftMsg=left>0 ? tr(`（のこり${left}回）`,` (${left} left)`) : tr("（きょうは終了）"," (done for today)");
    if(rec.score===null || avg>rec.score){
      isBest=true;
      rec.score=avg; saveDailyRec(rec);
      $("#finalBest").textContent=tr("🏆 きょうのベストこうしん！","🏆 New daily best!")+leftMsg;
    }else{
      $("#finalBest").textContent=tr(`きょうのベスト：${(+rec.score).toFixed(2)}点`,`Today's best: ${(+rec.score).toFixed(2)}`)+leftMsg;
    }
    // 押せなくはせず薄く見せる（押すと「また明日ね！」と理由が出る方が親切）
    $("#btnRetry").style.opacity = left===0 ? .55 : 1;
  }else if(seededRun && !endlessRun){
    $("#finalBest").textContent = best[mode]!==undefined
      ? tr(`自己ベスト：${(+best[mode]).toFixed(2)}点（シード戦は記録対象外）`,`Personal best: ${(+best[mode]).toFixed(2)} (seed runs aren't recorded)`)
      : tr("シード戦は自己ベスト対象外","Seed runs don't count toward your best");
  }else if(twistSelRun){
    $("#finalBest").textContent = tr("変化球セレクトは記録対象外（れんしゅう）","Twist-select runs aren't recorded (practice)");
  }else if(endlessRun){
    const reason = endDeadReason==="cap"
      ? tr("👑 かんぜんせいは！","👑 Perfect run!")
      : tr(`😵 ごうかくライン ${endPass(Math.max(0,scored.length-1))}点にとどかず`,
           `😵 Below the ${endPass(Math.max(0,scored.length-1))}-point pass line`);
    // シード付きチャレンジ（同じお題での対戦）は自己ベストに記録しない
    if(seededRun){
      $("#finalBest").textContent=reason+tr("　シード戦は記録対象外","  (seed runs aren't recorded)");
    }else if(best.endless===undefined || survived>best.endless){
      best.endless=survived; saveBest(best); isBest=true;
      $("#finalBest").textContent=reason+tr("　🏆 自己ベストこうしん！","  🏆 New personal best!");
    }else{
      $("#finalBest").textContent=reason+tr(`　自己ベスト：${best.endless}ラウンド`,`  Best: ${best.endless} rounds`);
    }
  }else if(best[mode]===undefined || avg>best[mode]){
    best[mode]=avg; saveBest(best); isBest=true;
    $("#finalBest").textContent=tr("🏆 自己ベストこうしん！","🏆 New personal best!");
  }else{
    $("#finalBest").textContent=tr(`自己ベスト：${(+best[mode]).toFixed(2)}点`,`Personal best: ${(+best[mode]).toFixed(2)}`);
  }
  // ハリガネ／まんまるの日（セレクト含む。封印中のハリガネモードも）はテーマ称号。
  // チャレンジは死んだ回を含む平均だと不当に低く出るので、グレードと同じ avgAlive で決める
  const ttl=titleOf(endlessRun ? avgAlive : avg, gameTwist==="maru" ? TITLES_MARU
    : (gameTwist==="wire" || mode==="wire") ? TITLES_WIRE : null);
  $("#finalTitleLine").textContent=`${ttl.emoji} ${ttl.name}`;
  /* かくしバッジ（条件を満たしたものを並べる。増やす時はここにpushする） */
  const specials=[];
  const add=(k,src)=>{ const s=src[k]; if(s) specials.push({key:k, name: JA?s.ja:s.en, emoji:s.emoji}); };
  const R=roundsInfo.filter(r=>!r.practice);          // 本番ラウンドだけ
  const half=Math.max(1, Math.ceil(R.length/2));
  const doods=R.filter(r=>r.doodle).map(r=>r.doodle);
  if(doods.length>=half){
    const cnt=k=>doods.filter(d=>d===k).length;
    const top=["art","text","circle"].reduce((a,k)=>cnt(k)>cnt(a)?k:a,"art");
    // 1種類に偏っていればその称号、絵も文字も丸も混ざっていれば「らくがき王」
    add(cnt(top)>=doods.length*0.7 ? top : "any", DOODLE_TITLES);
  }
  if(R.some(r=>r.oneStroke)) add("oneStroke",SPECIAL_TITLES);
  if(R.filter(r=>r.mirrored).length>=2) add("mirror",SPECIAL_TITLES);
  // グリッド／点描の回が半分以上（採点は向き判定で既に0点近くになる。バッジは別々）
  if(R.filter(r=>r.gridish==="grid").length>=half) add("grid",SPECIAL_TITLES);
  if(R.filter(r=>r.gridish==="dots").length>=half) add("impress",SPECIAL_TITLES);
  // 補助線をたくさん使う人（立方体の外に全辺長と同じくらい線を引いている）
  if(R.filter(r=>r.farInk>=0.8).length>=half) add("guide",SPECIAL_TITLES);
  /* 早撃ち／ギリギリ職人は「絶対秒」で書くと、制限時間が4〜7秒のチャレンジ後半で
     全ラウンドが自動的に条件を満たしてしまう。制限時間に対する割合で見る
     （30秒なら従来どおり10秒以内／残り2秒未満と同じ意味になる） */
  const usedFast = r => (r.limit||TIME_LIMIT)-r.secLeft <= Math.min(10,(r.limit||TIME_LIMIT)*0.34);
  const clutchy  = r => r.secLeft < Math.min(2,(r.limit||TIME_LIMIT)*0.07);
  if(R.filter(r=>r.secLeft!=null && usedFast(r) && r.score>=55).length>=3) add("quick",SPECIAL_TITLES);
  if(R.filter(r=>r.secLeft!=null && !r.timedOut && clutchy(r)).length>=half) add("clutch",SPECIAL_TITLES);
  // 消しゴムの魔術師: よく消して、それでいて点も出している
  if(R.filter(r=>r.erased>=3).length>=half && avg>=40) add("eraser",SPECIAL_TITLES);
  // 無の境地: 本番で一本も描かなかった
  if(R.length && R.every(r=>r.strokeCount===0)) add("zen",SPECIAL_TITLES);
  /* 左手がはやい人: ボタンではなくCtrl+Zで戻している人。3回以上のラウンドで使い、
     かつボタンよりキーボードのほうが多いこと（たまたま1回押した人は対象外） */
  const uKey=R.reduce((a,r)=>a+(r.undoKey||0),0), uBtn=R.reduce((a,r)=>a+(r.undoBtn||0),0);
  if(R.filter(r=>(r.undoKey||0)>0).length>=3 && uKey>uBtn) add("undoKey",SPECIAL_TITLES);
  // よく見る人: 描き出すまでじっくり見ている（平均8秒以上）のに点も出している
  const firsts=R.map(r=>r.firstAt).filter(v=>v!=null);
  const avgLim=R.length ? R.reduce((a,r)=>a+(r.limit||TIME_LIMIT),0)/R.length : TIME_LIMIT;
  if(firsts.length>=half && firsts.reduce((a,b)=>a+b,0)/firsts.length>=Math.min(8,avgLim*0.27)
     && avg>=40) add("observer",SPECIAL_TITLES);
  // アオリに強い人: アオリ／フカンの回を1つも落としていない
  const st=R.filter(r=>r.tilted);
  if(st.length && Math.min(...st.map(r=>r.score))>=Math.max(65,avg)) add("steep",SPECIAL_TITLES);
  // いちからやり直す人: 「ぜんぶけす」を半分以上の回で使い、それでも点を出している
  if(R.filter(r=>(r.cleared||0)>0).length>=half && avg>=40) add("clear",SPECIAL_TITLES);
  // 夜ふかし絵師: 深夜2〜5時
  const hh=new Date().getHours(); if(hh>=2 && hh<5) add("night",SPECIAL_TITLES);
  /* 集めたバッジの種類を記録し、4種類以上で「バッジコレクター」を贈る */
  let owned=[]; try{ const v=JSON.parse(localStorage.getItem(COLLECT_KEY)); if(Array.isArray(v)) owned=v; }catch(_){}
  // チャレンジは条件が特殊（短時間・少ラウンド）でバッジが取りやすいので、
  // コレクションには加算しない（16種の価値を守る。表示はする）
  if(!endlessRun)
    specials.forEach(s=>{ if(COLLECTIBLES.includes(s.key) && !owned.includes(s.key)) owned.push(s.key); });
  owned=owned.filter(k=>COLLECTIBLES.includes(k));
  try{ localStorage.setItem(COLLECT_KEY, JSON.stringify(owned)); }catch(_){}
  if(owned.length>=4) add("collector",SPECIAL_TITLES);
  const bx=$("#finalBadges"); bx.innerHTML="";
  specials.slice(0,4).forEach(s=>{ const el=document.createElement("span");   // 4つまで表示
    el.textContent=`${s.emoji} ${s.name}`; bx.appendChild(el); });
  // 集めた数を見せて「他にもあるのか」と探させる（中身は明かさない）
  $("#collectLine").textContent = owned.length
    ? tr(`🎭 バッジコレクション ${owned.length} / ${COLLECTIBLES.length}`,
         `🎭 Badges collected ${owned.length} / ${COLLECTIBLES.length}`) : "";
  $("#finalSeed").textContent=tr(`🔗 シード ${gameSeed}（クリックでコピー）`,`🔗 Seed ${gameSeed} (click to copy)`);
  lastFinal={avg, g, isBest, ttl, specials, survived, avgAlive, endless:endlessRun};
  // ランキング欄（設定済みかつ対象ボードがある時だけ表示）
  const rb = RANK_ENABLED ? boardKey() : null;
  $("#rankBox").classList.toggle("hidden", !rb);
  if(rb){
    $("#rankEntry").classList.remove("hidden");
    $("#btnRankSubmit").disabled=false;
    $("#rankResult").textContent="";
    let nm=""; try{ nm=localStorage.getItem("cube-challenge-name")||""; }catch(_){}
    $("#rankName").value = nm;    // 空ならプレースホルダ（未記入でランダム名）が見える
  }
  Sound.fanfare(isBest);
  if(g==="S" || isBest){ fx.burst(150); setTimeout(()=>fx.burst(110),450); }
  $("#finalOverlay").classList.remove("hidden");
}

/* ---- round snapshot popup & replay ---- */
let curShotIdx=-1, replayRaf=null, replayGen=0;
function stopReplay(){
  replayGen++;   // img.onload待ちの再生開始も含めて無効化する（2連打で二重ループにならないように）
  if(replayRaf){ cancelAnimationFrame(replayRaf); replayRaf=null; }
  $("#shotAnim").classList.add("hidden");
  $("#shotBig").classList.remove("hidden");
}
function openShot(i){
  const info=roundsInfo[i];
  if(!info || !info.shot) return;
  stopReplay();
  curShotIdx=i;
  $("#shotBig").src=info.shot;
  $("#shotCap").textContent = tr(
    `ラウンド${i+1}${info.practice?"（れんしゅう）":""} — ${info.score.toFixed(2)}点${info.timedOut?" ⏰":""}`,
    `Round ${i+1}${info.practice?" (practice)":""} — ${info.score.toFixed(2)} pts${info.timedOut?" ⏰":""}`);
  $("#btnReplay").disabled = !(info.baseShot && info.strokes && info.strokes.length);
  $("#shotPopup").classList.remove("hidden");
}
function startReplay(i){
  const info=roundsInfo[i];
  if(!info || !info.baseShot || !info.strokes || !info.strokes.length){
    toast(tr("この回にはリプレイできる線がないよ","No strokes to replay in this round")); return;
  }
  stopReplay();
  const gen=replayGen;
  const img=new Image();
  img.onload=()=>{
    if(gen!==replayGen) return;   // このリプレイは既に停止/差し替え済み
    const c=$("#shotAnim");
    c.width=img.width; c.height=img.height;
    $("#shotBig").classList.add("hidden"); c.classList.remove("hidden");
    const g=c.getContext("2d");
    g.lineCap="round"; g.lineJoin="round";
    const k=info.shotScale||1;
    let t0=Infinity, t1=0;
    for(const s of info.strokes) for(const p of s.pts){ if(p.t<t0)t0=p.t; if(p.t>t1)t1=p.t; }
    if(!isFinite(t0)){ t0=0; t1=1; }
    const durPlay=clamp((t1-t0)/2, 800, 6000); // 2倍速・0.8〜6秒におさめる
    const start=performance.now();
    (function frame(){
      if(gen!==replayGen) return;   // 停止済みループの孤児化を防ぐ
      const prog=Math.min(1,(performance.now()-start)/durPlay);
      const tNow=t0+(t1-t0)*prog;
      g.clearRect(0,0,c.width,c.height);
      g.drawImage(img,0,0);
      g.strokeStyle="#5f6fd6"; g.fillStyle="#5f6fd6";
      for(const s of info.strokes){
        const pts=s.pts;
        if(!pts.length || pts[0].t>tNow) continue;
        if(pts.length===1){
          g.beginPath(); g.arc(pts[0].x*k,pts[0].y*k,Math.max(1,pts[0].w*k/2),0,7); g.fill();
          continue;
        }
        for(let j=1;j<pts.length;j++){
          const a=pts[j-1], b=pts[j];
          if(a.t>tNow) break;
          let bx=b.x, by=b.y;
          if(b.t>tNow){
            const f=(tNow-a.t)/Math.max(1,b.t-a.t);
            bx=a.x+(b.x-a.x)*f; by=a.y+(b.y-a.y)*f;
          }
          g.lineWidth=Math.max(0.6,((a.w+b.w)/2)*k);
          g.beginPath(); g.moveTo(a.x*k,a.y*k); g.lineTo(bx*k,by*k); g.stroke();
          if(b.t>tNow) break;
        }
      }
      if(prog<1) replayRaf=requestAnimationFrame(frame);
      else replayRaf=null;
    })();
  };
  img.src=info.baseShot;
}
$("#shotPopup").addEventListener("click",()=>{ stopReplay(); $("#shotPopup").classList.add("hidden"); });
$("#btnReplay").addEventListener("click",e=>{ e.stopPropagation(); startReplay(curShotIdx); });

/* ---- toast ---- */
let toastTimer=null;
function toast(msg){
  const t=$("#toast");
  t.textContent=msg;
  t.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.add("hidden"),3500);
}

/* ---- online ranking (Supabase REST) ---- */
const RANK_ENABLED = !!(RANK_URL && RANK_KEY);
async function rankFetch(path, opts){
  opts=opts||{};
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),6000);
  try{
    return await fetch(RANK_URL+"/rest/v1/"+path,{
      ...opts, signal:ctrl.signal,
      headers:{ apikey:RANK_KEY, Authorization:"Bearer "+RANK_KEY,
                "Content-Type":"application/json", ...(opts.headers||{}) },
    });
  }finally{ clearTimeout(timer); }
}
/* ---- 匿名起動ログ（配信元別のプレイ数計測） ----
   送るのは「どの配信元か（itch/pages/pwa/app/other）」とバージョンだけ。
   端末やプレイヤーを識別する情報は一切含まない（privacy.htmlにも明記）。
   1端末1日1回だけ（localStorageで記録。成功時のみ記録＝失敗したら翌ロードで再試行）。
   テーブル未作成(404)でも黙って失敗するだけでゲームには影響しない */
(function(){
  try{
    if(!RANK_ENABLED || location.protocol==="file:") return;   // 開発中は数えない
    const LKEY="cube-challenge-lastlog";
    const today=todaySeedStr();
    if(localStorage.getItem(LKEY)===today) return;
    const standalone=(window.matchMedia && matchMedia("(display-mode: standalone)").matches)
      || navigator.standalone===true;
    const origin = CAP ? "app"
      : location.hostname.includes("itch") ? "itch"
      : standalone ? "pwa"
      : location.hostname.includes("github.io") ? "pages"
      : "other";
    fetch(RANK_URL+"/rest/v1/launches",{method:"POST",
      headers:{apikey:RANK_KEY, Authorization:"Bearer "+RANK_KEY,
               "Content-Type":"application/json", Prefer:"return=minimal"},
      body:JSON.stringify({origin, ver:GAME_VER}),
    }).then(r=>{ if(r.ok){ try{ localStorage.setItem(LKEY,today); }catch(_){} } }).catch(()=>{});
  }catch(_){}
})();

/* ランキングの集計単位: 通常プレイ=モード別 / デイリー=その日 / シード戦・変化球セレクト=対象外。
   チャレンジだけは単位が「点」ではなく「ラウンド数」なので、盤の接頭辞から分ける
   （mode: の盤を点スケール前提で集計している既存SQLを汚さないため） */
const boardKey = () => isDaily ? "daily:"+(dailyDate||todaySeedStr())
  : (seededRun || twistSelRun) ? null
  : endlessRun ? "rounds:endless" : "mode:"+mode;
/* 端末ごとの匿名プレイヤーID（同一ブラウザ=同一プレイヤーとしてベスト1行を維持） */
function playerId(){
  let id=null;
  try{ id=localStorage.getItem("cube-challenge-pid"); }catch(_){}
  if(!id){
    id = (crypto && crypto.randomUUID) ? crypto.randomUUID()
       : Math.random().toString(36).slice(2)+Date.now().toString(36);
    try{ localStorage.setItem("cube-challenge-pid",id); }catch(_){}
  }
  return id;
}
async function rankCount(board, q){
  const r=await rankFetch(`scores?select=id&board=eq.${encodeURIComponent(board)}${q||""}&limit=1`,
    {headers:{Prefer:"count=exact"}});
  return parseInt((r.headers.get("content-range")||"//0").split("/")[1],10)||0;
}
/* 名前を書かなかった人には、画家の名前をパロディにしたランダム名を進呈する。
   前置き×画家×後置きの組み合わせで数千通り。DB側の上限に合わせて12文字以内に収める。 */
const PAINTER_STEMS=["ピカソ","ゴッホ","モネ","マネ","ダリ","ミロ","ムンク","クリムト","セザンヌ",
  "ルノワール","ゴーギャン","マティス","シャガール","フェルメール","レンブラント","ラファエロ",
  "ミケランジェロ","ターナー","クールベ","スーラ","ロートレック","エッシャー","ボッシュ","ブリューゲル",
  "ホクサイ","写楽","雪舟","若冲","光琳","大観","蕪村","歌麿","広重","国芳","応挙","鉄斎","ゴヤ","エル・グレコ"];
const NAME_PRE=["","","","","","ニセ","自称","元","明日の","令和の","未来の","本日の","深夜の","負けない"];
const NAME_SUF=["","","","二世","三世","Jr.","風","もどき","見習い","先生","くん","ちゃん","さん",
  "太郎","次郎","ぽい","たぶん","部長","参上","の弟子","の孫","未満","級","気分","目指す","かもしれない"];
const PAINTER_EN=["Picassoish","Van Gogh Jr","Monet-ish","Dali 2nd","Miro-like","Munch Jr",
  "Klimtish","Cezanne-y","Renoirish","Matissey","Chagalish","Vermeerio","Turnerish","Seurat Jr",
  "Escherish","Hokusai Jr","Goyaish","Boschy","Manet-ish","Rubensy"];
const _pick = a => a[Math.floor(Math.random()*a.length)];
function randomPainterName(){
  if(!JA){
    for(let i=0;i<30;i++){ const n=_pick(PAINTER_EN); if(n.length<=12) return n; }
    return "Painter";
  }
  for(let i=0;i<50;i++){
    const n=_pick(NAME_PRE)+_pick(PAINTER_STEMS)+_pick(NAME_SUF);
    if(n.length>=1 && n.length<=12) return n;
  }
  return _pick(PAINTER_STEMS).slice(0,12);
}

/* ランキングは誰にでも見える場所なので、明らかに不適切な名前は登録させない */
/* 追加時の注意: ここは部分一致なので、短い語を足すと普通の名前を巻き込む。
   足したら必ずNG_SAFEに誤爆する実在の語を書くこと（sex→Essex、anal→analog など）。
   「えろ」「あなる」のような短いかな語は かえろ／きえろ／ぬりかえろ 等と衝突するので入れない。 */
const NG_WORDS=["fuck","shit","bitch","cunt","nigg","fag","whore","rape","asshole","dick",
  "porn","sex","slut","hentai",
  "死ね","殺す","しね","ころす","ちんこ","ちんちん","ちんぽ","まんこ","うんこ",
  "セックス","レイプ","キチガイ","きちがい","ポルノ","ヘンタイ","変態",
  "unko","chinko","manko","korosu"];
/* 全角・カタカナ・記号ちがいの抜け道を塞ぎつつ、普通の名前を巻き込まない。
   Nishitani / Yoshitaka / Grape / Dickens などは先に安全リストで通す。
   取りこぼしは結果画面の「不適切な名前を報告」から作者が消す運用で補う。 */
const NG_SAFE=[/nishit/,/yoshit/,/toshit/,/ashit/,/kishit/,/hashit/,/mashit/,
  /grape/,/drape/,/dicken/,/dickin/,/dicky/,/bunko/,/funko/,
  /essex/,/sussex/,/wessex/,/unisex/,/sexton/,           // sex を含む実在の語
  /ころすけ/,/こけし/,/しねま/,/しねこん/,/おいしね/];
const toHira = s => s.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const isNgName = s => {
  const t = toHira(String(s).normalize("NFKC").toLowerCase())
    .replace(/[^0-9a-zぁ-ゟ一-鿿]/g,"");   // 記号・空白・区切りを除去
  if(!t) return false;
  /* 安全語は「名前全体を免罪」せず、その部分だけ取り除いた残りを検査する。
     （旧実装は「こけし死ね」のように安全語を添えるだけでNG語が素通りだった） */
  let rest=t;
  for(const re of NG_SAFE) rest=rest.replace(new RegExp(re.source,"g"),"");
  return NG_WORDS.some(w=>rest.includes(toHira(w.normalize("NFKC").toLowerCase())));
};

/* このランの代表入力デバイス。一番多く点を描いたもの。1本も描いていなければ null */
function mainInput(){
  let best=null, bn=0;
  for(const k in inputPts) if(inputPts[k]>bn){ bn=inputPts[k]; best=k; }
  return (best==="pen"||best==="mouse"||best==="touch") ? best : null;
}
const INPUT_ICON={pen:"🖊",mouse:"🖱",touch:"👆"};
const inputLabel=k=>({pen:tr("ペン","Pen"),mouse:tr("マウス","Mouse"),touch:tr("指","Touch")})[k]||"";

async function submitScore(){
  if($("#btnRankSubmit").disabled) return;  // 送信中のEnter連打・多重呼び出しを無視
  if(!lastFinal) return;
  const board=boardKey(); if(!board) return;
  const name=((($("#rankName").value)||"").trim()||randomPainterName()).slice(0,12);
  $("#rankName").value=name;      // 自動生成された名前を本人にも見せる
  if(isNgName(name)){
    toast(tr("その名前は登録できません…べつの名前にしてね","That name can't be used — please pick another"));
    return;
  }
  try{ localStorage.setItem("cube-challenge-name",name); }catch(_){}
  $("#btnRankSubmit").disabled=true;
  $("#rankResult").textContent=tr("そうしんちゅう…","Submitting…");
  try{
    // 同一プレイヤー(端末ID)はベストスコアで1行を上書き（RPC経由のみ）。
    // 旧方式の直接INSERTはサーバ側のRLSで封鎖済みなのでフォールバックは持たない。
    /* チャレンジは「生き延びたラウンド数」が成績。ただし値の種類が十数個しかなく
       素の整数だと同着だらけで、TOP10が最初に到達した10人で固定されてしまう。
       小数部に「生き延びた回の平均点/100」を入れて同着を崩す
       （降順ソートでラウンド数が必ず優先され、同ラウンドなら内容の良い方が上）。 */
    /* 小数部は「整数部へ繰り上がらない」ことが絶対条件。
       avgAlive=100.00（満点を続けた人）で 0.9999→四捨五入で 1.00 になり、
       1ラウンドが2ラウンドとして登録されるバグを実測で踏んだ。
       整数点に切り捨てて 0.99 を上限にする（同着崩しの精度は1点刻みで十分） */
    const sendVal = lastFinal.endless
      ? lastFinal.survived + Math.floor(Math.min(99, lastFinal.avgAlive))/100
      : lastFinal.avg;
    let stored=sendVal;
    const base={p_pid:playerId(), p_name:name, p_board:board, p_score:sendVal};
    const inp=mainInput();
    let r=await rankFetch("rpc/submit_score",{method:"POST",
      body:JSON.stringify(inp?{...base, p_input:inp}:base)});
    // 入力デバイス列がまだ無いサーバーでは引数が合わず404になる。その場合は旧形式で送り直す
    // （SQLとクライアントのどちらを先に更新しても壊れないようにするため）
    if(r.status===404 && inp){
      r=await rankFetch("rpc/submit_score",{method:"POST",body:JSON.stringify(base)});
    }
    if(r.ok){
      try{ const v=await r.json(); if(typeof v==="number") stored=v; }catch(_){}
    }
    if(!r.ok) throw new Error("post "+r.status);
    const higher=await rankCount(board,"&score=gt."+stored);
    const total=await rankCount(board,"");
    // input列がまだ無いサーバーだと400が返るので、その場合は列なしで取り直す
    let top=[];
    let tr1=await rankFetch(
      `scores?select=name,score,input&board=eq.${encodeURIComponent(board)}&order=score.desc,created_at.asc&limit=10`);
    if(!tr1.ok) tr1=await rankFetch(
      `scores?select=name,score&board=eq.${encodeURIComponent(board)}&order=score.desc,created_at.asc&limit=10`);
    try{ top=await tr1.json(); }catch(_){ top=[]; }
    const esc=s=>String(s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
    // 盤の単位で表示を変える（ラウンド盤は整数部だけ見せる。小数部は同着崩し用の内部値）
    const fmt = v => lastFinal.endless
      ? tr(`${Math.floor(+v)}ラウンド`,`${Math.floor(+v)} rounds`) : (+v).toFixed(2);
    const rows=top.map((e,i)=>{
      const ic=INPUT_ICON[e.input]||"";
      return `<div class="rrow${e.name===name&&Math.abs(e.score-stored)<0.005?" me":""}">`+
        `<span>${i+1}. ${esc(e.name)}${ic?` <span class="rin" title="${inputLabel(e.input)}">${ic}</span>`:""}</span>`+
        `<span>${fmt(e.score)}</span></div>`;
    }).join("");
    // TOP10がどの入力デバイスで占められているか（追加の通信は発生しない）
    const mix={};
    top.forEach(e=>{ if(INPUT_ICON[e.input]) mix[e.input]=(mix[e.input]||0)+1; });
    const mixTxt=Object.keys(mix).length
      ? `<div class="rmix">${tr("上位10人","Top 10")}: ` +
        ["pen","mouse","touch"].filter(k=>mix[k]).map(k=>`${INPUT_ICON[k]}${mix[k]}`).join("　") + `</div>`
      : "";
    const bestNote = stored>sendVal+0.004
      ? `<div style="font-size:12px;color:#9a8090;">${tr(`じこベスト ${fmt(stored)}でとうろく中`,`Your best ${fmt(stored)} stays on the board`)}</div>` : "";
    $("#rankResult").innerHTML=
      `<div class="big">🏅 ${tr(`${total}人中 ${higher+1}位！`,`Rank ${higher+1} of ${total}!`)}</div>${bestNote}${rows}${mixTxt}`;
    $("#rankEntry").classList.add("hidden");
  }catch(_){
    $("#rankResult").textContent=tr("送信に失敗しました…（通信環境を確認してね）","Submission failed… (check your connection)");
    $("#btnRankSubmit").disabled=false;
  }
}
$("#btnRankSubmit").addEventListener("click",submitScore);
$("#rankName").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); submitScore(); } });

const loadImg = src => new Promise(res=>{
  if(!src) return res(null);
  const im=new Image();
  im.onload=()=>res(im); im.onerror=()=>res(null);
  im.src=src;
});
function drawCover(g,im,x,y,w,h,r){
  g.save(); g.beginPath();
  if(g.roundRect) g.roundRect(x,y,w,h,r); else g.rect(x,y,w,h);
  g.fillStyle="#fff"; g.fill(); g.clip();
  if(im){
    const s=Math.max(w/im.width, h/im.height);
    const dw=im.width*s, dh=im.height*s;
    g.drawImage(im, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
  }
  g.restore();
  g.strokeStyle="#ffd9e8"; g.lineWidth=3;
  g.beginPath();
  if(g.roundRect) g.roundRect(x,y,w,h,r); else g.rect(x,y,w,h);
  g.stroke();
}
async function buildShareCard(){
  const Wc=1200, Hc=675, M=48, F="'Segoe UI','Yu Gothic UI',sans-serif";
  const c=document.createElement("canvas"); c.width=Wc; c.height=Hc;
  const g=c.getContext("2d");
  const gr=g.createLinearGradient(0,0,Wc,Hc);
  gr.addColorStop(0,"#ffe9f2"); gr.addColorStop(.55,"#f3ecff"); gr.addColorStop(1,"#e8f4ff");
  g.fillStyle=gr; g.fillRect(0,0,Wc,Hc);
  g.textAlign="left";
  g.fillStyle="#54455a"; g.font="800 44px "+F;
  g.fillText(tr("🧊 立方体チャレンジ","🧊 Cube Challenge"), M, 78);
  g.fillStyle="#8a6f80"; g.font="700 25px "+F;
  g.fillText(MODES[mode].name + (lastFinal.endless
    ? tr("　どこまでいけた？","  ·  How far did you get?")
    : tr("　そうごうスコア","  ·  Total Score")), M, 118);
  g.textAlign="right";
  g.fillStyle="#54455a"; g.font="800 74px "+F;
  if(lastFinal.endless){
    // エンドレスの主役は到達ラウンド数。平均点は添えるだけ
    g.fillText(tr(`${lastFinal.survived} ラウンド`,`${lastFinal.survived} rounds`), Wc-M, 88);
    g.fillStyle="#8a6f80"; g.font="800 30px "+F;
    g.fillText(tr(`生きのこった回の平均 ${lastFinal.avgAlive.toFixed(2)}点`,
                  `Avg while alive ${lastFinal.avgAlive.toFixed(2)}`), Wc-M, 132);
  }else{
    g.fillText(lastFinal.avg.toFixed(2)+tr("点"," pts"), Wc-M, 88);
    g.fillStyle=gradeColor(lastFinal.g); g.font="800 36px "+F;
    g.fillText(tr("グレード ","Grade ")+lastFinal.g, Wc-M, 132);
  }
  /* サムネイル。通常は4列×2行（練習2＋本番6）。
     チャレンジは何ラウンドになるか分からないので、画像が残っている回だけを
     1行に詰めて並べる（カードの高さは固定なので、はみ出させない） */
  const cells=roundsInfo.map((info,i)=>({info,i})).filter(c=>c.info.shot||!endlessRun);
  const shown=endlessRun ? cells.slice(-END_KEEP_SHOTS) : cells;
  const imgs=await Promise.all(shown.map(c=>loadImg(c.info.shot)));
  const cols=endlessRun ? Math.max(4,Math.min(8,shown.length)) : 4;
  const gw=(Wc-2*M-(cols-1)*14)/cols, gh=endlessRun&&cols>4 ? 108 : 138;
  shown.forEach((c,k)=>{
    const info=c.info;
    const x=M+(k%cols)*(gw+14), y=162+Math.floor(k/cols)*(gh+44);
    drawCover(g,imgs[k],x,y,gw,gh,10);
    g.textAlign="center"; g.fillStyle=info.practice?"#b3a08a":"#8a6f80"; g.font="700 19px "+F;
    g.fillText(info.practice?`R${c.i+1} 🌱`:`R${c.i+1}  ${info.score.toFixed(2)}`, x+gw/2, y+gh+28);
  });
  g.textAlign="center"; g.fillStyle="#54455a"; g.font="800 34px "+F;
  const sp=(lastFinal.specials||[]);
  g.fillText(tr(`称号：${lastFinal.ttl.emoji} ${lastFinal.ttl.name}`,`Title: ${lastFinal.ttl.emoji} ${lastFinal.ttl.name}`)+(lastFinal.isBest?"　🏆":""),
    Wc/2, sp.length?Hc-100:Hc-80);
  if(sp.length){
    const shown=sp.slice(0,3);
    let txt=shown.map(s=>`${s.emoji} ${s.name}`).join("　＋　")
      + (sp.length>3 ? tr(`　ほか${sp.length-3}`,`  +${sp.length-3}`) : "");
    g.fillStyle="#7a6ab8";
    let fs=22;                                  // 幅に収まるまで縮める
    for(; fs>12; fs--){ g.font="800 "+fs+"px "+F; if(g.measureText(txt).width<=Wc-2*M) break; }
    g.fillText(txt, Wc/2, Hc-62);
  }
  g.textAlign="left"; g.fillStyle="#e86f9e"; g.font="800 26px "+F;
  g.fillText(tr("#立方体チャレンジ","#CubeChallenge"), M, Hc-26);
  g.textAlign="right"; g.fillStyle="#8a6f80"; g.font="700 22px "+F;
  if(isDaily){
    const dm=(dailyDate||"").match(/(\d+)-(\d+)-(\d+)$/);   // 開始時の日付を刻む
    const lbl=dm?`${+dm[2]}/${+dm[3]}`:"";
    g.fillText(tr(`📅 デイリー ${lbl}`,`📅 Daily ${lbl}`), Wc-M, Hc-26);
  }
  return c.toDataURL("image/png");
}
function buildShareText(){

  const link = !base

               : tr(` あそんでみて→ ${base}`,` Play it → ${base}`))
    : tr(` おなじお題に挑戦→ `,` Try the same puzzles → `)+`${base}?seed=${encodeURIComponent(gameSeed)}&mode=${mode}`;

    `Cube Challenge [♾️ Endless] — survived ${lastFinal.survived} rounds! (avg ${lastFinal.avgAlive.toFixed(2)} while alive)${spEn}${link} #CubeChallenge`);

    `立方体チャレンジ（${MODES[mode].name}${isDaily?"・きょうのチャレンジ":""}）${lastFinal.avg.toFixed(2)}点・グレード${lastFinal.g} 称号「${lastFinal.ttl.name}」${spTxt}！${link} #立方体チャレンジ`,

}

/* ---- デイリーチャレンジ・シード入力・URLチャレンジ ---- */
const DAILY_KEY="cube-challenge-daily-v1";
/* きょうのチャレンジは1日3回まで（挑戦を始めた時点で1回消費する）。
   端末内の記録なので厳密な制限ではないが、粘り勝ちを防ぐ目安として機能する。 */
const DAILY_MAX=3;
function dailyRec(date){
  const d=date||todaySeedStr();
  let r=null; try{ r=JSON.parse(localStorage.getItem(DAILY_KEY)); }catch(_){}
  if(!r || r.date!==d) r={date:d, score:null, tries:0};
  if(typeof r.tries!=="number" || !(r.tries>=0)) r.tries=0;
  if(typeof r.score!=="number") r.score=null;
  return r;
}
function saveDailyRec(r){ try{ localStorage.setItem(DAILY_KEY, JSON.stringify(r)); }catch(_){} }
function dailyLeft(){ return Math.max(0, DAILY_MAX-dailyRec().tries); }
function startDaily(){
  const r=dailyRec();
  if(r.tries>=DAILY_MAX){
    toast(tr(`きょうの挑戦は${DAILY_MAX}回までです。また明日ね！`,`${DAILY_MAX} tries per day — see you tomorrow!`));
    refreshDaily();
    return;
  }
  r.tries++; saveDailyRec(r);
  startGame("normal",{seed:todaySeedStr(),daily:true});
}
function refreshDaily(){
  const rec=dailyRec(), left=Math.max(0, DAILY_MAX-rec.tries);
  const best = rec.score!==null ? tr(`きょう ${(+rec.score).toFixed(2)}点 / `,`Today ${(+rec.score).toFixed(2)} · `) : "";
  $("#bestDailyLab").textContent = best + (left>0
    ? tr(`のこり${left}回`,`${left} left`)
    : tr("きょうは終了","done for today"));
  const b=$("#btnDaily");
  b.disabled = left===0;
  b.style.opacity = left===0 ? .55 : 1;
}

/* リサイズ・画面回転時はお題を作り直さず、一様スケール＋平行移動で安全域に収め直す。
   （作り直すと不利／チートになるため。相似変換なので採点条件は変わらない） */
window.addEventListener("resize",()=>{
  resizeCanvases();
  if(round && (!Number.isFinite(round.cubes[0].P[0].x) || round.targets.length===0)){
    // 非表示タブ(0x0)などで壊れた状態で生成されたラウンドは作り直す
    if(W>50 && H>50) newRound();
    return;
  }
  if(round){
    const landscape = W>=H;
    const mL=24, mR=landscape?195:24, mT=70, mB=landscape?40:175;
    const availW=Math.max(60,W-mL-mR), availH=Math.max(60,H-mT-mB);
    const pts=[]; round.cubes.forEach(c=>pts.push(...c.P));
    const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    const l=Math.min(...xs), r=Math.max(...xs), t=Math.min(...ys), b=Math.max(...ys);
    const bw=Math.max(r-l,1e-6), bh=Math.max(b-t,1e-6);
    // 収まらないときだけ縮小（勝手に拡大はしない）
    const s=Math.min(1, availW/bw*0.98, availH/bh*0.98);
    const cx0=(l+r)/2, cy0=(t+b)/2;
    let ax=(mL+(W-mR))/2 - cx0*s, ay=(mT+(H-mB))/2 - cy0*s;
    // 相似変換後に安全域からはみ出していれば平行移動で戻す
    const nl=l*s+ax, nr=r*s+ax, nt=t*s+ay, nb=b*s+ay;
    if(nl<mL) ax+=mL-nl; else if(nr>W-mR) ax+=W-mR-nr;
    if(nt<mT) ay+=mT-nt; else if(nb>H-mB) ay+=H-mB-nb;
    if(s!==1 || ax!==0 || ay!==0){
      const seen=new Set();
      const xf=p=>{ if(seen.has(p))return; seen.add(p); p.x=p.x*s+ax; p.y=p.y*s+ay; };
      round.cubes.forEach(c=>{ c.P.forEach(xf); c.tol*=s; });   // targetsのpa,pbはc.Pと同じ参照
      // pa/pb は通常 c.P への参照（seenが二重変換を防ぐ）。変化球のターゲットが
      // 独立した点を持つ場合に取り残さないよう、ここで必ず変換する
      round.targets.forEach(t2=>{ xf(t2.pa); xf(t2.pb); t2.samples.forEach(xf);
        if(t2.pts) t2.pts.forEach(xf);   // ポリライン点（まんまるの円は独立点。diceはP参照でseenが守る）
        t2.tol*=s; });
      // りったい十字の「隠れた折り目」も独立した点を持つので変換する
      if(round.crossHidden) round.crossHidden.forEach(g=>{ xf(g.pa); xf(g.pb); });
      // ヒント線（まんまるの直径など）が独立した点を持つ場合も取り残さない（seenが二重変換を防ぐ）
      if(round.hintLines) round.hintLines.forEach(hl=>hl.forEach(xf));
      // allSegsのpa,pbはEXT延長した独立コピーなので、座標も必ず変換する
      // （忘れると採点が移動前の位置と照合され、正確な絵が大減点になる）
      round.allSegs.forEach(g=>{ xf(g.pa); xf(g.pb); g.tol*=s; });
      strokes.forEach(st=>st.pts.forEach(xf));
      if(cur) cur.pts.forEach(xf);
      history.forEach(snap=>snap.forEach(st=>st.pts.forEach(xf)));
      hoverPos=null;
    }
  }
  rebuildInk(); render();
});

  forceTimeout(){ if(state==="draw" && !round.practice){ deadline=performance.now(); } },
  nudgeTimer(sec){ if(state==="draw") deadline=performance.now()+sec*1000; },   // 検証用
  gen(m,w,h){ return genRound(m,false,w||W,h||H); },
  randomName(){ return randomPainterName(); },
  isNg(s){ return isNgName(s); },
  dailyLeft(){ return dailyLeft(); },
  renderNow(){ drawScene(); },

  get roundsInfo(){ return roundsInfo; },
  get seed(){ return gameSeed; },
  get twist(){ return gameTwist; },
  start(m,o){ startGame(m,o); },
};
